<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Сообщения · FLOUSTREAM</title>
  <link rel="preload" as="style" href="./routes/styles/messages.css?v=1">
</head>
<body>
<main class="wrap">
 <header class="chat-head">
  <a class="back" id="back" href="profile.html" aria-label="Назад">‹</a>
  <div class="avatar" id="peer-avatar">◉</div>
  <div class="person"><div class="person-name" id="peer-name">Открываем переписку…</div><div class="person-handle" id="peer-handle"></div></div>
  <button class="game-toggle" id="game-toggle" type="button" hidden>Играть</button>
 </header>
<section class="chat">
 <div class="messages" id="messages"><div class="empty">Подключаем сообщения…</div></div>
 <iframe class="game-frame" id="game-frame" title="Игра в длинные нарды" hidden loading="lazy"></iframe>
 <div class="notice" id="notice" aria-live="polite"></div>
 <progress class="upload-progress" id="upload-progress" max="100" value="0" hidden aria-label="Прогресс загрузки вложения"></progress>
 <section class="attachment-preview" id="attachment-preview" hidden aria-label="Предпросмотр вложений">
  <div class="attachment-preview-list" id="attachment-preview-list"></div>
  <div class="attachment-preview-footer">
   <span class="attachment-preview-count" id="attachment-preview-count"></span>
   <button class="attachment-preview-action" id="attachment-cancel" type="button">Отмена</button>
   <button class="attachment-preview-action primary" id="attachment-send" type="button">Отправить</button>
  </div>
 </section>
 <form class="composer" id="composer">
  <input id="attachment-input" type="file" hidden multiple accept="image/*,video/*,audio/*,.pdf,.zip,.doc,.docx,.xls,.xlsx,.txt">
  <button class="attach" id="attach" type="button" aria-label="Прикрепить фото, видео, аудио или файл">+</button>
  <textarea id="message-input" maxlength="5000" rows="1" placeholder="Написать сообщение…" aria-label="Текст сообщения"></textarea>
  <button class="send" id="send" type="submit" aria-label="Отправить">➤</button>
 </form>
</section>
</main>
<div class="photo-viewer" id="photo-viewer" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" hidden>
 <button class="photo-viewer-close" id="photo-viewer-close" type="button" aria-label="Закрыть фотографию">×</button>
 <img id="photo-viewer-image" alt="">
</div>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(new URL("./service-worker.js", document.baseURI).href, {
    scope: new URL("./", document.baseURI).pathname
  }).catch(error => console.warn("FLOUSTREAM page cache unavailable:", error));
}
</script>
  <script type="module" src="./app-router.js?v=1"></script>
  <script src="./navigation.js?v=1" defer></script>
</body>
</html>
