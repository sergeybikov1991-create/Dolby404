
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOLBY404 — Portal</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(-45deg,
        #050817, #102b83, #5420a8,
        #006b9f, #10104a, #050817);
    background-size: 500% 500%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.portal {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 600px;
    text-align: center;
    padding: 30px 20px;
}

.logo {
    position: relative;
    font-size: clamp(48px, 12vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #168cff,
                 0 0 35px #5420ff,
                 0 0 70px #006bff;
    animation: glitch 3s infinite, digitalFlash 5s infinite;
}

@keyframes glitch {
    0%, 88%, 100% {
        transform: translate(0);
        opacity: 1;
    }
    90% { transform: translate(-5px, 2px); }
    92% {
        transform: translate(5px, -2px);
        opacity: 0.75;
    }
    94% {
        transform: translate(0);
        opacity: 1;
    }
}

@keyframes digitalFlash {
    0%, 87%, 100% { filter: brightness(1); }
    89% { filter: brightness(2.5) hue-rotate(90deg); }
    91% { filter: brightness(0.6) hue-rotate(-90deg); }
    93% { filter: brightness(1.8); }
}

.logo::before,
.logo::after {
    content: "DOLBY404";
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.logo::before {
    color: #00eaff;
    animation: glitchLine 3s infinite;
}

.logo::after {
    color: #c000ff;
    animation: glitchLine 2.5s infinite reverse;
}

@keyframes glitchLine {
    0%, 85%, 100% {
        clip-path: inset(0 0 100% 0);
        transform: translateX(0);
    }
    88% {
        clip-path: inset(20% 0 65% 0);
        transform: translateX(-7px);
    }
    91% {
        clip-path: inset(60% 0 20% 0);
        transform: translateX(7px);
    }
    94% {
        clip-path: inset(40% 0 45% 0);
        transform: translateX(-3px);
    }
}

.subtitle {
    color: #b9d9ff;
    letter-spacing: 5px;
    margin: 20px 0 35px;
}



.auth-box {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #63baff;
    border-radius: 30px;
    background: rgba(5, 8, 23, 0.8);
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #b9d9ff;
}

button {
    padding: 16px 25px;
    border: 1px solid #63baff;
    border-radius: 40px;
    color: white;
    background: linear-gradient(90deg, #1749c9, #7025bd);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #176bff;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 40px #168cff;
}

button:disabled {
    opacity: 0.5;
    cursor: wait;
}

#auth-message {
    color: #b9d9ff;
    overflow-wrap: anywhere;
    min-height: 22px;
}

/* ЭФФЕКТ РАЗБИТОГО СТЕКЛА */

#glass-layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
}

.glass-effect {
    opacity: 1;
    animation: glassFade 2.2s ease-out forwards;
}

.glass-main {
    fill: none;
    stroke: #dffaff;
    stroke-width: 1.5;
    stroke-linejoin: bevel;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #00dfff)
            drop-shadow(0 0 7px #168cff);
}

.glass-thin {
    fill: none;
    stroke: #a8f4ff;
    stroke-width: 0.8;
    stroke-linejoin: bevel;
    stroke-linecap: round;
    filter: drop-shadow(0 0 3px #00cfff);
}

.glass-glow {
    fill: none;
    stroke: white;
    stroke-width: 3;
    opacity: 0.35;
    filter: blur(2px);
}

.glass-shard {
    stroke: #b9f5ff;
    stroke-width: 0.8;
    fill: rgba(100, 210, 255, 0.07);
    filter: drop-shadow(0 0 4px #168cff);
}

.glass-center {
    fill: white;
    filter: drop-shadow(0 0 8px #00eaff)
            drop-shadow(0 0 18px #168cff);
}

@keyframes glassFade {
    0% { opacity: 1; }
    65% { opacity: 0.9; }
    100% { opacity: 0; }
}
</style>
</head>

<body>

<svg id="glass-layer"></svg>

<div class="portal">
    <div class="logo">DOLBY404</div>
    <div class="subtitle">ENTER THE DIGITAL WORLD</div>

    <div class="auth-box">
        <input id="email" type="email"
               placeholder="Твой Email">

        <input id="password" type="password"
               placeholder="Пароль (минимум 8 символов)">

        <button id="register-button" disabled>
            Зарегистрироваться
        </button>

        <button id="login-button" disabled>
            Войти
        </button>

        <p id="auth-message">Подключаем систему...</p>
    </div>

</div>

<script>
const SUPABASE_URL =
    "https://qhpobdktlbhdqsnajypr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tzG1qVsbjaW8YE_LBVN87Q_v0CahKN5";

let supabaseClient = null;

const message = document.getElementById("auth-message");
const registerButton = document.getElementById("register-button");
const loginButton = document.getElementById("login-button");

function showError(prefix, error) {
    console.error(prefix, error);

    message.textContent =
        prefix + (error && error.message
            ? error.message
            : String(error));
}

/* ЗАГРУЗКА SUPABASE */

function loadSupabase() {
    return new Promise((resolve, reject) => {
        if (window.supabase &&
            typeof window.supabase.createClient === "function") {
            resolve();
            return;
        }

        const script = document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

        script.onload = () => {
            if (window.supabase &&
                typeof window.supabase.createClient === "function") {
                resolve();
            } else {
                reject(new Error(
                    "Библиотека загрузилась, но Supabase не найден."
                ));
            }
        };

        script.onerror = () => {
            reject(new Error(
                "Не удалось загрузить Supabase. Проверь интернет."
            ));
        };

        document.head.appendChild(script);
    });
}

async function initializeSupabase() {
    try {
        message.textContent = "Подключаем Supabase...";

        await loadSupabase();

        supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        registerButton.disabled = false;
        loginButton.disabled = false;

        message.textContent =
            "Система готова. Можно продолжать.";

    } catch (error) {
        showError("Ошибка подключения: ", error);
    }
}

/* РЕГИСТРАЦИЯ */

async function registerUser() {
    if (!supabaseClient) {
        message.textContent = "Supabase ещё не подключён.";
        return;
    }

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {
        message.textContent = "Введи Email и пароль.";
        return;
    }

    if (password.length < 8) {
        message.textContent =
            "Пароль должен содержать минимум 8 символов.";
        return;
    }

    try {
        registerButton.disabled = true;
        message.textContent = "Регистрируем...";

        const redirectUrl = new URL(
            "home.html",
            window.location.href
        ).href;

        const { data, error } =
            await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    emailRedirectTo: redirectUrl
                }
            });

        if (error) {
            showError("Ошибка регистрации: ", error);
            return;
        }

        if (data.session) {
            message.textContent = "Регистрация успешна!";
            window.location.href = redirectUrl;
        } else {
            message.textContent =
                "Регистрация принята. Проверь почту и подтверди Email.";
        }

    } catch (error) {
        showError("Сбой регистрации: ", error);
    } finally {
        registerButton.disabled = false;
    }
}

/* ВХОД */

async function loginUser() {
    if (!supabaseClient) {
        message.textContent = "Supabase ещё не подключён.";
        return;
    }

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {
        message.textContent = "Введи Email и пароль.";
        return;
    }

    try {
        loginButton.disabled = true;
        message.textContent = "Входим...";

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) {
            showError("Ошибка входа: ", error);
            return;
        }

        message.textContent = "Вход выполнен!";

        window.location.href = new URL(
            "home.html",
            window.location.href
        ).href;

    } catch (error) {
        showError("Сбой входа: ", error);
    } finally {
        loginButton.disabled = false;
    }
}

registerButton.addEventListener("click", registerUser);
loginButton.addEventListener("click", loginUser);

initializeSupabase();

/* ГЕНЕРАТОР РАЗБИТОГО СТЕКЛА */

const glassLayer = document.getElementById("glass-layer");

const SVG_NS = "http://www.w3.org/2000/svg";

function svgElement(name, attributes) {
    const element = document.createElementNS(SVG_NS, name);

    for (const key in attributes) {
        element.setAttribute(key, attributes[key]);
    }

    return element;
}

function randomBetween(min, max) {
    return min + Math.random() * (max - min);
}

function makePath(points) {
    return points.map((point, index) =>
        (index === 0 ? "M " : "L ") +
        point.x.toFixed(1) + " " +
        point.y.toFixed(1)
    ).join(" ");
}

function addCrack(group, points, className) {
    group.appendChild(svgElement("path", {
        d: makePath(points),
        class: className
    }));
}

function createGlass(event) {
    const x = event.clientX;
    const y = event.clientY;

    const width = window.innerWidth;
    const height = window.innerHeight;

    const group = svgElement("g", {
        class: "glass-effect"
    });

    glassLayer.appendChild(group);

    const radius = randomBetween(35, 55);
    const shardCount = 12;

    /* Центральная точка удара */

    group.appendChild(svgElement("circle", {
        cx: x,
        cy: y,
        r: 4,
        class: "glass-center"
    }));

    /* Неровные радиальные трещины */

    const rays = [];

    for (let i = 0; i < shardCount; i++) {
        const angle =
            (Math.PI * 2 * i / shardCount) +
            randomBetween(-0.12, 0.12);

        const points = [{
            x: x + Math.cos(angle) * radius,
            y: y + Math.sin(angle) * radius
        }];

        let distance = radius;

        const maxDistance = randomBetween(
            Math.max(width, height) * 0.25,
            Math.max(width, height) * 0.7
        );

        const stepCount = 6;

        for (let j = 1; j <= stepCount; j++) {
            distance += maxDistance / stepCount;

            const bend = randomBetween(-22, 22);
            const a = angle + bend * Math.PI / 180;

            points.push({
                x: x + Math.cos(a) * distance,
                y: y + Math.sin(a) * distance
            });
        }

        rays.push(points);

        addCrack(group, points, "glass-glow");
        addCrack(group, points, "glass-main");

        /* Тонкие ответвления от главной трещины */

        for (let j = 2; j < points.length - 1; j++) {
            if (Math.random() > 0.65) continue;

            const p = points[j];

            const branchAngle =
                angle + randomBetween(-1.1, 1.1);

            const branchLength =
                randomBetween(25, 100);

            const branchPoints = [p];

            let bx = p.x;
            let by = p.y;

            for (let k = 0; k < 3; k++) {
                bx += Math.cos(branchAngle +
                    randomBetween(-0.3, 0.3)) *
                    branchLength / 3;

                by += Math.sin(branchAngle +
                    randomBetween(-0.3, 0.3)) *
                    branchLength / 3;

                branchPoints.push({ x: bx, y: by });
            }

            addCrack(group, branchPoints, "glass-thin");
        }
    }

    /* Соединяем радиальные трещины ломаными линиями,
       формируя грани стеклянных осколков */

    for (let ring = 0; ring < 3; ring++) {
        const ringPoints = [];

        for (let i = 0; i < rays.length; i++) {
            const points = rays[i];

            const index = Math.min(
                ring + 2,
                points.length - 1
            );

            const p = points[index];

            ringPoints.push({
                x: p.x + randomBetween(-18, 18),
                y: p.y + randomBetween(-18, 18)
            });
        }

        for (let i = 0; i < ringPoints.length; i++) {
            const next = (i + 1) % ringPoints.length;

            if (Math.random() > 0.15) {
                addCrack(group, [
                    ringPoints[i],
                    {
                        x: (ringPoints[i].x +
                            ringPoints[next].x) / 2 +
                            randomBetween(-15, 15),

                        y: (ringPoints[i].y +
                            ringPoints[next].y) / 2 +
                            randomBetween(-15, 15)
                    },
                    ringPoints[next]
                ], "glass-thin");
            }
        }
    }

    /* Небольшие треугольные осколки вокруг удара */

    for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const distance = randomBetween(45, 150);

        const sx = x + Math.cos(angle) * distance;
        const sy = y + Math.sin(angle) * distance;
        const size = randomBetween(8, 24);

        const polygon = [
            [sx, sy],
            [sx + randomBetween(-size, size),
             sy + randomBetween(-size, size)],
            [sx + randomBetween(-size, size),
             sy + randomBetween(-size, size)]
        ].map(point => point.join(",")).join(" ");

        group.appendChild(svgElement("polygon", {
            points: polygon,
            class: "glass-shard"
        }));
    }

    /* Вспышка в месте удара */

    group.appendChild(svgElement("circle", {
        cx: x,
        cy: y,
        r: 13,
        fill: "none",
        stroke: "white",
        "stroke-width": 2,
        filter: "drop-shadow(0 0 8px #00eaff)"
    }));

    setTimeout(() => {
        group.remove();
    }, 2300);
}

document.addEventListener("pointerdown", (event) => {
    /* Не запускаем эффект на самих элементах интерфейса */
    if (event.target.closest(
        "input, button, .logo, .subtitle, #auth-message, .music-note, iframe"
    )) {
        return;
    }

    /* Любое свободное место страницы — фон, отступ или промежуток */
    createGlass(event);
});

</script>

</body>
</html>
