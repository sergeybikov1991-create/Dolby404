
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOUSTREAM — Portal</title>

<style id="floustream-critical-shell-style">html,body{min-height:100%;background:#090910}body{margin:0;background:radial-gradient(ellipse at 18% 0%,#20102f 0,transparent 42%),#090910;color:#f5f0ff}</style>
</head>

<body>

<svg id="glass-layer"></svg>

<div class="portal">
    <div class="logo">FLOUSTREAM</div>
    <div class="subtitle">ENTER THE DIGITAL WORLD</div>

    <div class="auth-box">
        <input id="email" type="email"
               placeholder="Твой Email">

        <input id="password" type="password"
               placeholder="Пароль (минимум 8 символов)">

        <input id="first-name" type="text" autocomplete="given-name"
               placeholder="Имя (для регистрации)" maxlength="60">
        <input id="last-name" type="text" autocomplete="family-name"
               placeholder="Фамилия (для регистрации)" maxlength="60">
        <select id="country-code" aria-label="Страна">
            <option value="">Выбери страну</option>
            <option value="DE">Германия</option><option value="RU">Россия</option>
            <option value="UA">Украина</option><option value="BY">Беларусь</option>
            <option value="KZ">Казахстан</option><option value="NL">Нидерланды</option>
            <option value="US">США</option><option value="GB">Великобритания</option>
            <option value="OTHER">Другая страна</option>
        </select>
        <select id="preferred-language" aria-label="Язык по умолчанию">
            <option value="ru">Русский</option><option value="en">English</option>
        </select>

        <button id="register-button" disabled>
            Зарегистрироваться
        </button>

        <button id="login-button" disabled>
            Войти
        </button>

        <button id="restore-button" type="button" disabled>
            Восстановить аккаунт
        </button>

        <p id="auth-message">Подключаем систему...</p>
    </div>

</div>



<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register(new URL("./service-worker.js", document.baseURI).href, {
    scope: new URL("./", document.baseURI).pathname
  }).catch(error => console.warn("FLOUSTREAM page cache unavailable:", error));
}
</script>
  <script type="module" src="./app-router.js?v=1"></script>
  <script src="./navigation.js?v=1" defer></script>
</body>
</html>
