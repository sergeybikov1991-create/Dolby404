
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolby404 — Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(-45deg,
        #050817, #102b83, #5420a8,
        #006b9f, #10104a, #050817);
    background-size: 500% 500%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.portal {
    width: 100%;
    max-width: 600px;
    text-align: center;
    padding: 30px 20px;
}

.logo {
    position: relative;
    font-size: clamp(48px, 12vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #168cff,
                 0 0 35px #5420ff,
                 0 0 70px #006bff;
    animation: glitch 3s infinite, digitalFlash 5s infinite;
}

@keyframes glitch {
    0%, 88%, 100% {
        transform: translate(0);
        opacity: 1;
    }
    90% {
        transform: translate(-5px, 2px);
    }
    92% {
        transform: translate(5px, -2px);
        opacity: 0.75;
    }
    94% {
        transform: translate(0);
        opacity: 1;
    }
}

@keyframes digitalFlash {
    0%, 87%, 100% { filter: brightness(1); }
    89% { filter: brightness(2.5) hue-rotate(90deg); }
    91% { filter: brightness(0.6) hue-rotate(-90deg); }
    93% { filter: brightness(1.8); }
}

.logo::before,
.logo::after {
    content: "DOLBY404";
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.logo::before {
    color: #00eaff;
    animation: glitchLine 3s infinite;
}

.logo::after {
    color: #c000ff;
    animation: glitchLine 2.5s infinite reverse;
}

@keyframes glitchLine {
    0%, 85%, 100% {
        clip-path: inset(0 0 100% 0);
        transform: translateX(0);
    }
    88% {
        clip-path: inset(20% 0 65% 0);
        transform: translateX(-7px);
    }
    91% {
        clip-path: inset(60% 0 20% 0);
        transform: translateX(7px);
    }
    94% {
        clip-path: inset(40% 0 45% 0);
        transform: translateX(-3px);
    }
}

.subtitle {
    color: #b9d9ff;
    letter-spacing: 5px;
    margin: 20px 0 35px;
}

.auth-box {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #63baff;
    border-radius: 30px;
    background: rgba(5, 8, 23, 0.8);
    color: white;
    font-size: 16px;
    outline: none;
}

input::placeholder {
    color: #b9d9ff;
}

button {
    padding: 16px 25px;
    border: 1px solid #63baff;
    border-radius: 40px;
    color: white;
    background: linear-gradient(90deg, #1749c9, #7025bd);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #176bff;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 40px #168cff;
}

#auth-message {
    color: #b9d9ff;
    overflow-wrap: anywhere;
}

#cracks {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
}

.crack {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg,
        transparent, #ffffff, #8beaff, transparent);
    box-shadow: 0 0 5px #8beaff, 0 0 12px #168cff;
    transform-origin: left center;
    animation: crackFade 2s ease-out forwards;
}

@keyframes crackFade {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
}

.shatter-flash {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid white;
    border-radius: 50%;
    box-shadow: 0 0 15px #00eaff, 0 0 30px #168cff;
    transform: translate(-50%, -50%);
    animation: flashOut 0.6s ease-out forwards;
}

@keyframes flashOut {
    to {
        transform: translate(-50%, -50%) scale(5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="cracks"></div>

<div class="portal">
    <div class="logo">DOLBY404</div>
    <div class="subtitle">ENTER THE DIGITAL WORLD</div>

    <div class="auth-box">
        <input id="email" type="email" placeholder="Твой Email">
        <input id="password" type="password" placeholder="Пароль (минимум 8 символов)">

        <button onclick="registerUser()">
    Зарегистрироваться
</button>

        <button onclick="loginUser()">
            Войти
        </button>

        <p id="auth-message"></p>
    </div>
</div>

<script>
const SUPABASE_URL = "https://qhpobdktlbhdqsnajypr.supabase.co";
const SUPABASE_KEY = "sb_publishable_tzG1qVsbjaW8YE_LBVN87Q_v0CahKN5";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

async function registerUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("auth-message");

    message.textContent = "Регистрируем...";

    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    if (data.session) {
        message.textContent = "Регистрация успешна!";
        window.location.href = "home.html";
    } else {
        message.textContent = "Проверь почту и подтверди регистрацию.";
    }
}

async function loginUser() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("auth-message");

    message.textContent = "Входим...";

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        message.textContent = error.message;
        return;
    }

    message.textContent = "Вход выполнен!";
    window.location.href = "home.html";
}

const crackLayer = document.getElementById("cracks");

document.addEventListener("pointerdown", function(event) {
    const x = event.clientX;
    const y = event.clientY;

    const flash = document.createElement("span");
    flash.className = "shatter-flash";
    flash.style.left = x + "px";
    flash.style.top = y + "px";
    crackLayer.appendChild(flash);

    const rays = 12;

    for (let i = 0; i < rays; i++) {
        const angle = (Math.PI * 2 * i) / rays
                    + (Math.random() - 0.5) * 0.35;
        const length = 100 + Math.random() * 180;

        const crack = document.createElement("span");
        crack.className = "crack";
        crack.style.left = x + "px";
        crack.style.top = y + "px";
        crack.style.width = length + "px";
        crack.style.transform = "rotate(" + angle + "rad)";
        crackLayer.appendChild(crack);

        setTimeout(() => crack.remove(), 2100);
    }

    setTimeout(() => flash.remove(), 700);
});
</script>

</body>
</html>
