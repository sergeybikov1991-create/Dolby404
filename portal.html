<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolby404 — Portal</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(-45deg,
        #050817, #102b83, #5420a8,
        #006b9f, #10104a, #050817);
    background-size: 500% 500%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.portal {
    text-align: center;
    padding: 30px;
}

.logo {
    font-size: clamp(48px, 12vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #168cff,
                 0 0 35px #5420ff,
                 0 0 70px #006bff;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 88%, 100% {
        transform: translate(0);
        opacity: 1;
        text-shadow: 0 0 15px #168cff, 0 0 40px #5420ff;
    }
    90% {
        transform: translate(-5px, 2px);
        text-shadow: 5px 0 #00eaff, -5px 0 #a000ff;
    }
    92% {
        transform: translate(5px, -2px);
        opacity: 0.75;
    }
    94% {
        transform: translate(0);
        opacity: 1;
    }
}

.subtitle {
    color: #b9d9ff;
    letter-spacing: 5px;
    margin: 20px 0 35px;
}

button {
    padding: 16px 32px;
    border: 1px solid #63baff;
    border-radius: 40px;
    color: white;
    background: linear-gradient(90deg, #1749c9, #7025bd);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #176bff;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 40px #168cff;
}
</style>
</head>
<body>
<div class="portal">
    <div class="logo">DOLBY404</div>
    <div class="subtitle">ENTER THE DIGITAL WORLD</div>
    <button>Регистрация через Google</button>
</div>
</body>
</html>
