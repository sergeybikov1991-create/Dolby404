<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolby404 — Portal</title>
    <style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(-45deg,
        #050817, #102b83, #5420a8,
        #006b9f, #10104a, #050817);
    background-size: 500% 500%;
    animation: gradientMove 12s ease infinite;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.portal {
    text-align: center;
    padding: 30px;
}

.logo {
    font-size: clamp(48px, 12vw, 100px);
    font-weight: 900;
    letter-spacing: 8px;
    text-shadow: 0 0 15px #168cff,
                 0 0 35px #5420ff,
                 0 0 70px #006bff;
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 88%, 100% {
        transform: translate(0);
        opacity: 1;
        text-shadow: 0 0 15px #168cff, 0 0 40px #5420ff;
    }
    90% {
        transform: translate(-5px, 2px);
        text-shadow: 5px 0 #00eaff, -5px 0 #a000ff;
    }
    92% {
        transform: translate(5px, -2px);
        opacity: 0.75;
    }
    94% {
        transform: translate(0);
        opacity: 1;
    }
}

.subtitle {
    color: #b9d9ff;
    letter-spacing: 5px;
    margin: 20px 0 35px;
}

button {
    padding: 16px 32px;
    border: 1px solid #63baff;
    border-radius: 40px;
    color: white;
    background: linear-gradient(90deg, #1749c9, #7025bd);
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 25px #176bff;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.07);
    box-shadow: 0 0 40px #168cff;
}
/* Цифровые вспышки */
.logo {
    position: relative;
    animation: glitch 3s infinite, digitalFlash 5s infinite;
}

@keyframes digitalFlash {
    0%, 87%, 100% { filter: brightness(1); }
    89% { filter: brightness(2.5) hue-rotate(90deg); }
    91% { filter: brightness(0.6) hue-rotate(-90deg); }
    93% { filter: brightness(1.8); }
}

.logo::before,
.logo::after {
    content: "DOLBY404";
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.logo::before {
    color: #00eaff;
    animation: glitchLine 3s infinite;
}

.logo::after {
    color: #c000ff;
    animation: glitchLine 2.5s infinite reverse;
}

@keyframes glitchLine {
    0%, 85%, 100% {
        clip-path: inset(0 0 100% 0);
        transform: translateX(0);
    }
    88% {
        clip-path: inset(20% 0 65% 0);
        transform: translateX(-7px);
    }
    91% {
        clip-path: inset(60% 0 20% 0);
        transform: translateX(7px);
    }
    94% {
        clip-path: inset(40% 0 45% 0);
        transform: translateX(-3px);
    }
}

/* Эффект разбитого стекла */
#cracks {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    overflow: hidden;
}

.crack {
    position: absolute;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ffffff, #8beaff, transparent);
    box-shadow: 0 0 5px #8beaff, 0 0 12px #168cff;
    transform-origin: left center;
    animation: crackFade 2s ease-out forwards;
}

@keyframes crackFade {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; }
}

.shatter-flash {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid white;
    border-radius: 50%;
    box-shadow: 0 0 15px #00eaff, 0 0 30px #168cff;
    transform: translate(-50%, -50%);
    animation: flashOut 0.6s ease-out forwards;
}

@keyframes flashOut {
    to {
        transform: translate(-50%, -50%) scale(5);
        opacity: 0;
    }
}
    </style>
</head>
<div id="cracks"></div>

<script>
const crackLayer = document.getElementById("cracks");

document.addEventListener("pointerdown", function(event) {
    const x = event.clientX;
    const y = event.clientY;

    // Световая вспышка в точке удара
    const flash = document.createElement("span");
    flash.className = "shatter-flash";
    flash.style.left = x + "px";
    flash.style.top = y + "px";
    crackLayer.appendChild(flash);

    // Основные трещины
    const rays = 12;

    for (let i = 0; i < rays; i++) {
        const angle = (Math.PI * 2 * i) / rays
                    + (Math.random() - 0.5) * 0.35;
        const length = 100 + Math.random() * 180;

        const crack = document.createElement("span");
        crack.className = "crack";
        crack.style.left = x + "px";
        crack.style.top = y + "px";
        crack.style.width = length + "px";
        crack.style.transform = "rotate(" + angle + "rad)";
        crackLayer.appendChild(crack);

        setTimeout(() => crack.remove(), 2100);
    }

    setTimeout(() => flash.remove(), 700);
});
</script>
    <body>
<div class="portal">
    <div class="logo">DOLBY404</div>
    <div class="subtitle">ENTER THE DIGITAL WORLD</div>
    <button>Регистрация через Google</button>
</div>
</body>
</html>
