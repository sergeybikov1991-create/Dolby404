<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>
  <style>
    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;

    background: linear-gradient(
        -45deg,
        #050817,
        #102b83,
        #5420a8,
        #006b9f,
        #10104a,
        #050817
    );
    background-size: 500% 500%;
    animation: gradientMove 12s ease infinite;
    transition: background 0.6s ease;
    text-align: center;
}
body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, #101020, #263b70);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
}

body.purple::before {
    opacity: 1;
}
    .content {
      padding: 30px;
    }

    h1 {
    font-size: 38px;
    margin-bottom: 15px;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}
    @keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }
    50% {
        background-position: 100% 50%;
    }
    100% {
        background-position: 0% 50%;
    }
}
p {
    color: #c5cbe0;
    font-size: 18px;
    transform: scale(1);
    opacity: 1;
}

p.animate {
    animation: textPulse 2s ease-in-out;
}

@keyframes textPulse {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    50% {
        transform: scale(1.3);
        opacity: 1;
    }
    100% {
        transform: scale(1);
        opacity: 0;
    }
}
    

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #5478ff;
    transition: 0.3s;
cursor: pointer;  
    -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
      color: white;
      font-size: 16px;
    }
 button:hover {
    box-shadow: 0 0 20px #5478ff;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}
    #ripples {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.ripple {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%) scale(0.1);
    background: radial-gradient(
        circle,
        transparent 45%,
        rgba(190, 220, 255, 0.22) 47%,
        transparent 49%,
        rgba(190, 220, 255, 0.16) 52%,
        transparent 55%,
        rgba(190, 220, 255, 0.10) 59%,
        transparent 63%
    );
    animation: waterRipple 1.8s ease-out forwards;
}

@keyframes waterRipple {
    to {
        transform: translate(-50%, -50%) scale(5);
        opacity: 0;
    }
}

.content {
    position: relative;
    z-index: 1;
}
  </style>
</head>
<body>
<div id="ripples"></div>
  <div class="content">
    <h1>Добро пожаловать!</h1>
    <p id="message">Это мой первый сайт. И это только начало!</p>
    <button>Начать</button>
  </div> 
<script>
const button = document.querySelector("button");
const message = document.getElementById("message");
let typingTimer;
let pulseTimer;
  function typeText(element, text, repeat = false) {
    clearTimeout(typingTimer);
    clearTimeout(pulseTimer);

    element.classList.remove("animate");
    element.textContent = "";

    let index = 0;

    function type() {
        if (index < text.length) {
            element.textContent += text[index];
            index++;
            typingTimer = setTimeout(type, 70);
        } else if (repeat) {
            element.classList.remove("animate");
            void element.offsetWidth;
            element.classList.add("animate");

            pulseTimer = setTimeout(function() {
                element.classList.remove("animate");
                typeText(element, text, true);
            }, 2000);
        }
    }

    type();
}
typeText(message, "Это мой первый сайт. И это только начало!", true);
 button.addEventListener("click", function() {
    if (button.textContent === "Начать") {
        typeText(message, "Я сделал первый шаг в создании своего сайта!");
        document.body.classList.add("purple");
        button.textContent = "Продолжить";
    } else if (button.textContent === "Продолжить") {
        window.location.href = "portal.html";
    } else {
        typeText(message, "Это мой первый сайт. И это только начало!");
        document.body.classList.remove("purple");
        button.textContent = "Начать";
    }
}); 
const rippleLayer = document.getElementById("ripples");

document.addEventListener("pointerdown", function(event) {
    const ripple = document.createElement("span");

    ripple.className = "ripple";
    ripple.style.left = event.clientX + "px";
    ripple.style.top = event.clientY + "px";

    rippleLayer.appendChild(ripple);

    ripple.addEventListener("animationend", function() {
        ripple.remove();
    });
});
</script>
</body>
</html>
