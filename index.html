<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLOUSTREAM</title>
<script>
window.FLOUSTREAM_AUTH_PROVIDER = window.FLOUSTREAM_AUTH_PROVIDER || "supabase";
window.FLOUSTREAM_CLERK_PUBLISHABLE_KEY = window.FLOUSTREAM_CLERK_PUBLISHABLE_KEY || "";
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090910;color:#eee5ff;font:16px Arial}
.load{text-align:center;padding:24px}
.logo{font-size:30px;font-weight:900;letter-spacing:4px;text-shadow:0 0 20px #965cff}
</style>
</head>
<body>
<div class="load">
  <div class="logo">FLOUSTREAM</div>
  <p id="message">Открываем твою страницу…</p>
</div>
<script type="module">
function go(path){location.replace(path);}
try {
  const { getSupabaseClient } = await import("./shared/supabase-client.mjs");
  const client = await getSupabaseClient();
  const { data, error } = await client.auth.getSession();
  if (error) throw error;

  if (data.session) {
    const { data: userData, error: userError } = await client.auth.getUser();
    if (userError) throw userError;
    go(userData.user ? "profile.html" : "portal.html");
  } else {
    go("portal.html");
  }
} catch (error) {
  document.getElementById("message").textContent = "Не удалось подключиться. Переходим ко входу…";
  setTimeout(() => go("portal.html?auth_error=1"), 900);
}
</script>
</body>
</html>
