<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой первый сайт</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101020, #263b70);
   transition: background 0.6s ease;   
      text-align: center;
    }
body {
    isolation: isolate;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(135deg, #101020, #542b70);
    opacity: 0;
    transition: opacity 1.2s ease;
    pointer-events: none;
}

body.purple::before {
    opacity: 1;
}
    .content {
      padding: 30px;
    }

    h1 {
    font-size: 38px;
    margin-bottom: 15px;
    animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.15);
    }
}

    p {
      color: #c5cbe0;
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      background: #5478ff;
    transition: 0.3s;
cursor: pointer;  
    -webkit-tap-highlight-color: transparent;
      user-select: none;
      outline: none;
      color: white;
      font-size: 16px;
    }
 button:hover {
    box-shadow: 0 0 20px #5478ff;
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}
  </style>
</head>
<body>
  <div class="content">
    <h1>Добро пожаловать!</h1>
    <p id="message">Это мой первый сайт. И это только начало!</p>
    <button>Начать</button>
  </div> 
<script>
const button = document.querySelector("button");
const message = document.getElementById("message");

button.addEventListener("click", function() {
    if (button.textContent === "Начать") {
        message.textContent = "Ты сделал первый шаг в создании своего сайта!";
        document.body.classList.add("purple");
      button.textContent = "Начать сначала";
    } else {
        message.textContent = "Это мой первый сайт. И это только начало!";
        document.body.classList.remove("purple");
      button.textContent = "Начать";
    }
});
</script>
</body>
</html>
