<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080817">
<title>FLOUSTREAM</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100vh;min-height:100dvh;overflow:hidden;background:#080817;color:#f4efff;font-family:Arial,sans-serif}
#checking{position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#c8b5f4;background:radial-gradient(ellipse at 50% 35%,#28205b 0,#11112b 42%,#080817 78%)}
#checking[hidden],#welcome[hidden]{display:none}
#checking .wordmark{font-size:clamp(28px,8vw,48px);font-weight:900;letter-spacing:.12em;text-shadow:0 0 24px #8958ff}
#welcome{position:relative;isolation:isolate;display:grid;place-items:center;width:100%;min-height:100vh;min-height:100dvh;padding:28px 22px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#28205b 0,#151333 34%,#0a0a1b 72%,#070711 100%);touch-action:pan-y}
#welcome:before,#welcome:after{content:"";position:absolute;z-index:-1;width:min(75vw,560px);aspect-ratio:1;border:1px solid #9b76ff25;border-radius:50%;box-shadow:0 0 90px #7046ff18,inset 0 0 90px #2e74ff12;pointer-events:none}
#welcome:after{width:min(105vw,780px);border-color:#55c9ff16;transform:rotate(28deg) scaleY(.56)}
.content{width:min(100%,680px);text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.logo{font-size:clamp(34px,9vw,76px);font-weight:900;letter-spacing:clamp(2px,1.2vw,8px);line-height:1.1;white-space:nowrap;text-shadow:0 0 12px #168cff,0 0 32px #5420ff,0 0 68px #006bff}
.tagline{margin:18px 0 0;color:#c7b9ff;font-size:clamp(12px,2.8vw,16px);letter-spacing:clamp(2px,1vw,5px);text-transform:uppercase}
.intro{max-width:520px;margin:42px 0 0;color:#e8e2fa;font-size:clamp(20px,4.5vw,30px);line-height:1.35;font-weight:600}
.description{max-width:440px;margin:14px 0 0;color:#aaa5c6;font-size:15px;line-height:1.65}
.start{margin-top:42px;min-width:210px;padding:16px 28px;border:1px solid #8d73ff;border-radius:999px;background:linear-gradient(100deg,#2855c9,#7136bd);color:white;font-size:16px;font-weight:700;box-shadow:0 0 26px #714dff55;cursor:pointer}
.start:focus-visible{outline:2px solid #b9f6ff;outline-offset:4px}
.hint{display:flex;align-items:center;gap:12px;margin-top:25px;color:#aaa4c8;font-size:13px;letter-spacing:.04em}
.arrow{font-size:23px;color:#9bdfff;animation:nudge 1.5s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateX(0);opacity:.7}50%{transform:translateX(-9px);opacity:1}}
#entry-message{min-height:18px;margin-top:16px;color:#9c94bd;font-size:12px}
@media(prefers-reduced-motion:reduce){.arrow{animation:none}}
</style>
</head>
<body>
<div id="checking"><div class="wordmark">FLOUSTREAM</div><p>Проверяем аккаунт…</p></div>
<main id="welcome" hidden aria-label="Приветствие FLOUSTREAM">
  <div class="content">
    <div class="logo">FLOUSTREAM</div>
    <div class="tagline">ТВОЁ ЦИФРОВОЕ ПРОСТРАНСТВО</div>
    <h1 class="intro">Добро пожаловать в новый цифровой мир</h1>
    <p class="description">Общайся, делись моментами, смотри видео, слушай музыку и создавай своё пространство вместе с FLOUSTREAM.</p>
    <button class="start" id="start-button" type="button">Начать</button>
    <div class="hint"><span>Проведи по экрану справа налево</span><span class="arrow" aria-hidden="true">←</span></div>
    <div id="entry-message" role="status" aria-live="polite"></div>
  </div>
</main>
<script>
const SUPABASE_URL="https://qhpobdktlbhdqsnajypr.supabase.co";
const SUPABASE_KEY="sb_publishable_tzG1qVsbjaW8YE_LBVN87Q_v0CahKN5";
const STORAGE_KEY="sb-qhpobdktlbhdqsnajypr-auth-token";
const checking=document.getElementById("checking");
const welcome=document.getElementById("welcome");
function openAuth(){window.location.assign("portal.html");}
document.getElementById("start-button").addEventListener("click",openAuth);
let swipeStart=null;
welcome.addEventListener("pointerdown",event=>{
  if(event.target.closest("button"))return;
  swipeStart={x:event.clientX,y:event.clientY,id:event.pointerId};
});
welcome.addEventListener("pointerup",event=>{
  if(!swipeStart||swipeStart.id!==event.pointerId)return;
  const dx=event.clientX-swipeStart.x;
  const dy=event.clientY-swipeStart.y;
  swipeStart=null;
  if(dx < -65 && Math.abs(dx)>Math.abs(dy)*1.25)openAuth();
});
welcome.addEventListener("pointercancel",()=>{swipeStart=null;});
async function loadSupabase(){
  if(window.supabase?.createClient)return;
  await new Promise((resolve,reject)=>{
    const script=document.createElement("script");
    script.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
    script.onload=resolve;script.onerror=reject;document.head.appendChild(script);
  });
}
(async()=>{
  try{
    await loadSupabase();
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage,storageKey:STORAGE_KEY}});
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    if(data.session){window.location.replace("home.html");return;}
    checking.hidden=true;
    welcome.hidden=false;
  }catch(error){
    checking.hidden=true;
    welcome.hidden=false;
    document.getElementById("entry-message").textContent="Не удалось проверить аккаунт. Проверь подключение и попробуй продолжить.";
  }
})();
</script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register(new URL("./service-worker.js",document.baseURI).href,{scope:new URL("./",document.baseURI).pathname}).catch(error=>console.warn("FLOUSTREAM page cache unavailable:",error));}
</script>
</body>
</html>
