name: FLOUSTREAM Android 1.7

on:
  workflow_dispatch:
    inputs:
      build_release_candidate:
        description: "Собрать подписанный Release-кандидат после утверждения Debug"
        required: false
        type: boolean
        default: false
      publish_release:
        description: "Опубликовать v1.7 после проверки Release-кандидата"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - feature/apk-1.7-full-site-vk-integration
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-1.7.yml"

permissions:
  contents: write

concurrency:
  group: floustream-android-1-7
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Validate release controls
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && !inputs.build_release_candidate
        run: |
          echo "::error::A signed Release candidate must be built before publishing v1.7."
          exit 1

      - name: Check release signing secrets
        id: signing
        if: github.event_name == 'workflow_dispatch' && inputs.build_release_candidate
        env:
          KEYSTORE_B64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing or empty."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/floustream-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Generate FLOUSTREAM launcher icon resources
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python android-web-shell-test/scripts/generate_launcher_icons.py

      - name: Run unit tests
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Build signed Release APK candidate
        if: steps.signing.outputs.ready == 'true'
        working-directory: android-web-shell-test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify Release APK identity and signing certificate
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          CERT_SHA=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          EXPECTED_CERT_SHA="757681105E9DFA43B84036C637815FBA0A98FB6169DADF75E7AE136504A9EED9"
          if [ "$CERT_SHA" != "$EXPECTED_CERT_SHA" ]; then
            echo "::error::APK signing certificate does not match RELEASE-SIGNING-PASSPORT.md"
            echo "Expected certificate SHA-256: $EXPECTED_CERT_SHA"
            echo "Actual certificate SHA-256: ${CERT_SHA:-not-found}"
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "package: name='com.floustream.android' versionCode='107' versionName='1.7'"

      - name: Generate checksum and updater manifest
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s  %s\\n' "$SHA" "app-release.apk" > "$APK.sha256"
          printf '{"versionCode":107,"versionName":"1.7","apkUrl":"https://github.com/sergeybikov1991-create/Dolby404/releases/download/v1.7/app-release.apk","sha256":"%s"}\\n' "$SHA" > android-web-shell-test/app/build/outputs/apk/release/update.json

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-1.7-RC
          path: |
            android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub Release
        if: steps.signing.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.7
          name: FLOUSTREAM Android 1.7
          body: |
            FLOUSTREAM Android 1.7:
            - интеграция SPA-маршрутизации сайта с Android-оболочкой;
            - поддержка Shadow DOM для голосовых сообщений;
            - разрешения камеры и микрофона для доверенного сайта;
            - открытие главной ленты после подтверждения авторизации.
            Подписанный APK, SHA-256 и манифест встроенного обновления.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
          fail_on_unmatched_files: true
