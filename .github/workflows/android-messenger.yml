name: Build FLOUSTREAM Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-messenger/**"
      - ".github/workflows/android-messenger.yml"

permissions:
  contents: read

concurrency:
  group: android-messenger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Download pinned sherpa-onnx Android runtime
        working-directory: android-messenger/app
        run: |
          mkdir -p libs
          curl --fail --location --retry 3 --output libs/sherpa-onnx-1.13.5.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar
          echo "6419cd8bc983e0c4fab06067f0fe0313fdc0f7103818ac1e7a08d50787b7a82b  libs/sherpa-onnx-1.13.5.aar" | sha256sum --check --strict
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android-messenger
        run: gradle --no-daemon :app:assembleDebug
      - name: Run unit tests
        working-directory: android-messenger
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Messenger-debug
          path: android-messenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
