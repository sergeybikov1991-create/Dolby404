name: Build Dolby404 Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-messenger/**"
      - ".github/workflows/android-messenger.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: android-messenger
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolby404-Messenger-debug
          path: android-messenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
