name: Build Dolby404 Messenger APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-messenger/**"
      - ".github/workflows/android-messenger.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  debug-build:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android-messenger
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dolby404-Messenger-debug
          path: android-messenger/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore permanent signing key
        env:
          DOLBY404_KEYSTORE_BASE64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
        run: |
          test -n "$DOLBY404_KEYSTORE_BASE64" || (echo "Missing GitHub secret DOLBY404_KEYSTORE_BASE64" && exit 1)
          echo "$DOLBY404_KEYSTORE_BASE64" | base64 --decode > android-messenger/release-key.jks
      - name: Build signed release APK
        working-directory: android-messenger
        env:
          DOLBY404_KEYSTORE_PATH: release-key.jks
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          DOLBY404_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare release APK
        run: cp android-messenger/app/build/outputs/apk/release/app-release.apk Dolby404-Messenger.apk
      - name: Publish update
        uses: softprops/action-gh-release@v2
        with:
          files: Dolby404-Messenger.apk
          generate_release_notes: true
