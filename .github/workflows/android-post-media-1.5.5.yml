name: FLOUSTREAM Android 1.5.5 Post Media Release Candidate

on:
  push:
    branches:
      - fix/android-post-photos-1.5.4
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-post-media-1.5.5.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Опубликовать v1.5.5 для обновления внутри приложения после успешных проверок"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: floustream-android-post-media-1-5-5
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare established FLOUSTREAM release signing key
        env:
          KEYSTORE_B64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required FLOUSTREAM release signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/floustream-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Generate launcher icon resources
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python android-web-shell-test/scripts/generate_launcher_icons.py

      - name: Run Android unit tests
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed Release APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Verify APK package, version and established signing certificate
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          EXPECTED_CERT_SHA="757681105E9DFA43B84036C637815FBA0A98FB6169DADF75E7AE136504A9EED9"
          if [ "$CERT_SHA" != "$EXPECTED_CERT_SHA" ]; then
            echo "::error::Release APK signing certificate does not match the established FLOUSTREAM certificate."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.floustream.android' versionCode='124' versionName='1.5.5'"

      - name: Generate SHA-256 and in-app updater manifest
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "app-release.apk" > "$APK.sha256"
          printf '{"versionCode":124,"versionName":"1.5.5","apkUrl":"https://github.com/sergeybikov1991-create/Dolby404/releases/download/v1.5.5/app-release.apk","sha256":"%s"}\n' "$SHA" > android-web-shell-test/app/build/outputs/apk/release/update.json

      - name: Upload signed Release candidate
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-1.5.5-Release-Candidate
          path: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.5.5 for the in-app updater
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.5
          target_commitish: fix/android-post-photos-1.5.4
          name: FLOUSTREAM Android 1.5.5
          body: |
            FLOUSTREAM Android 1.5.5.
            Исправлено отображение фотографий в публикациях и предварительный показ первого кадра видео.
            Сохранена проверенная Android-основа 1.5.4 с игровым полем и push-уведомлениями.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
          fail_on_unmatched_files: true
