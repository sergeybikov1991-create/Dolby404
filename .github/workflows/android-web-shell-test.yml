name: FLOUSTREAM Android 2.0.1 Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/apk-2.0-debug-from-1.8
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-web-shell-test.yml"
  push:
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-web-shell-test.yml"

permissions:
  contents: read

concurrency:
  group: floustream-android-2-0-1-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate FLOUSTREAM launcher icon resources
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python android-web-shell-test/scripts/generate_launcher_icons.py
      - name: Run Android unit tests
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build Debug 2.0.1 APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Verify Android 2.0 chat fixes are present
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("android-web-shell-test/app/src/main/java/com/floustream/webshelltest/MainActivity.kt").read_text()
          required = {
              "Android photo viewer viewport correction": "floustream-android-photo-viewer-fit-v1",
              "Short tap remains the send action": "const wasShortTap = !!holdTimer && !recording && !startPending",
              "Pending attachment can be sent without text": "const hasPendingAttachments = !!preview && !preview.hidden",
              "Voice recorder retry after SPA route mount": "}, 900L)",
          }
          for label, marker in required.items():
              if marker not in source:
                  raise SystemExit(f"Missing required fix: {label}")
          dispatch_start = source.index("private fun checkAuthSession")
          dispatch_end = source.index("private fun checkSupabaseSession", dispatch_start)
          dispatch = source[dispatch_start:dispatch_end]
          clerk_start = source.index("private fun checkClerkSession")
          clerk_end = source.index("override fun onNewIntent", clerk_start)
          clerk_auth = source[clerk_start:clerk_end]
          legacy_start = source.index("private fun checkSupabaseSession")
          legacy_end = source.index("private fun checkClerkSession", legacy_start)
          legacy_auth = source[legacy_start:legacy_end]
          if "FLOUSTREAM_AUTH_PROVIDER" not in dispatch or "checkClerkSession(view)" not in dispatch or "checkSupabaseSession(view)" not in dispatch:
              raise SystemExit("Android auth provider dispatcher is missing")
          if "/rest/v1/rpc/floustream_user_id" not in source or "window.Clerk" not in source:
              raise SystemExit("Clerk session-to-FLOUSTREAM identity bridge is missing")
          if "auth/v1/token?grant_type=refresh_token" not in legacy_auth or "const rawSession" not in legacy_auth:
              raise SystemExit("Supabase fallback session path was not preserved")
          print("Android 2.0.1 Clerk identity bridge and Supabase fallback verified.")
          PY
      - name: Verify Debug APK identity
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "package: name='com.floustream.android.debug' versionCode='111' versionName='2.0.1-debug'"
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-2.0.1-Debug
          path: android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; refusing to start an extremely slow software-only Android emulator."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM exists but is not readable and writable by the runner."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
      - name: Run Android WebView emulator smoke test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd android-web-shell-test && gradle --no-daemon :app:connectedDebugAndroidTest
