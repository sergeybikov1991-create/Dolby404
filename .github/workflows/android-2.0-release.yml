name: FLOUSTREAM Android 2.2 Signed Release

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-2.0-from-1.6
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-2.0-release.yml"
      - "APK-2.0-ROADMAP.md"

permissions:
  contents: write

concurrency:
  group: floustream-android-2-2-release
  cancel-in-progress: true

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Check release signing secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required persistent FLOUSTREAM release signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/floustream-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"

      - name: Generate FLOUSTREAM launcher icon resources
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python android-web-shell-test/scripts/generate_launcher_icons.py

      - name: Run unit tests and build isolated Debug
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug

      - name: Verify Android 2.2 behavior contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("android-web-shell-test/app/src/main/java/com/floustream/webshelltest/MainActivity.kt").read_text()
          required = {
              "Android photo viewer viewport correction": "floustream-android-photo-viewer-fit-v1",
              "Short tap remains the send action": "const wasShortTap = !!holdTimer && !recording && !startPending",
              "Pending attachment can be sent without text": "const hasPendingAttachments = !!preview && !preview.hidden",
              "Voice recorder retries after SPA route mount": "}, 900L)",
              "SPA route lifecycle hook": "floustream:route-metric",
              "Push notification chat routing": "pendingNotificationPeerId",
              "Portal route visibility": "SiteRoutePolicy.isPortalRouteName(route)",
              "Login form route fallback": "document.querySelector('#email') && document.querySelector('#password')",
              "Profile route auth gate": "SiteRoutePolicy.isProfileRouteName(route)",
          }
          for label, marker in required.items():
              if marker not in source:
                  raise SystemExit(f"Missing required fix: {label}")
          auth_start = source.index("private fun checkSiteAuthSession")
          auth_end = source.index("private fun cancelAuthCheck", auth_start)
          auth = source[auth_start:auth_end]
          if "auth/v1/token?grant_type=refresh_token" in auth:
              raise SystemExit("Native Android must not refresh Supabase sessions")
          restore_write = "window.localStorage.setItem(storageKey, mirrored)"
          if restore_write not in auth:
              raise SystemExit("Persisted Supabase session restore is missing")
          if auth.count("localStorage.setItem") != 1:
              raise SystemExit(
                  "Native Android may only restore the mirrored Supabase session; "
                  "it must never create or rewrite one"
              )
          if "sessionMirrorStore.read()" not in auth:
              raise SystemExit("Restored session must come from the native mirror")
          if "auth/v1/user" not in auth or "__floustreamAuthCheckLastToken" not in auth:
              raise SystemExit("Read-only session validation and refresh handoff are missing")
          if "__floustreamAuthCheckGeneration" not in auth:
              raise SystemExit("Stale auth checks must be invalidated across sign-in route changes")
          site_policy = Path("android-web-shell-test/app/src/main/java/com/floustream/webshelltest/SiteRoutePolicy.kt").read_text()
          if "uri.port == -1 || uri.port == 443" not in site_policy or "uri.normalize().path != path" not in site_policy:
              raise SystemExit("Trusted site route policy was weakened")
          print("Android 2.0 chat, route and session contracts verified.")
          PY

      - name: Enable KVM for Android emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; refusing to start an extremely slow software-only Android emulator."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::KVM exists but is not readable and writable by the runner."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm

      - name: Run Android WebView emulator smoke test
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: cd android-web-shell-test && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Build signed Release APK
        working-directory: android-web-shell-test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK identity and signing certificate
        shell: bash
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          CERT_SHA=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          EXPECTED_CERT_SHA="757681105E9DFA43B84036C637815FBA0A98FB6169DADF75E7AE136504A9EED9"
          if [ "$CERT_SHA" != "$EXPECTED_CERT_SHA" ]; then
            echo "::error::APK signing certificate does not match RELEASE-SIGNING-PASSPORT.md"
            echo "Expected: $EXPECTED_CERT_SHA"
            echo "Actual: ${CERT_SHA:-not-found}"
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.floustream.android' versionCode='112' versionName='2.2'"

      - name: Generate checksum and updater manifest
        shell: bash
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "app-release.apk" > "$APK.sha256"
          printf '{"versionCode":112,"versionName":"2.2","apkUrl":"https://github.com/sergeybikov1991-create/Dolby404/releases/download/v2.2/app-release.apk","sha256":"%s"}\n' "$SHA" > android-web-shell-test/app/build/outputs/apk/release/update.json

      - name: Upload signed Release assets to CI
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-2.2-Signed-Release
          path: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish FLOUSTREAM Android 2.2 GitHub Release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-v2.2]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2
          target_commitish: ${{ github.sha }}
          name: FLOUSTREAM Android 2.2
          body: |
            FLOUSTREAM Android 2.2 — signed production Release.

            - Source base: signed Android APK 2.1
            - Package: `com.floustream.android`
            - Version: `2.2` (versionCode `112`)
            - The existing production signing certificate is preserved.
            - Saved sign-in now survives app restarts. The WebView can lose its asynchronous localStorage commit when Android kills the process, so supabase-js session writes are mirrored in app-private storage and restored on the next launch. The website Supabase JS client still owns every token refresh and rotation; Android never refreshes or rewrites a session.
            - Update from the installed 2.1 app through FLOUSTREAM's in-app updater. Do not sideload a separate APK.
            - The 1.6 Release remains the rollback point.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
