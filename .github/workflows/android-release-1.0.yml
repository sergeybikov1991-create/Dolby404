name: FLOUSTREAM Android 1.0 Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - release/android-1.0
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-release-1.0.yml"

permissions:
  contents: read

concurrency:
  group: floustream-android-release-1
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"

      - name: Build Debug and signed Release APK
        working-directory: android-web-shell-test
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon clean :app:assembleDebug :app:assembleRelease

      - name: Verify APK identity and signature
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "package: name='com.floustream.android' versionCode='100' versionName='1.0'"

      - name: Generate checksum and update manifest
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          printf '%s\n' "$SHA" > "$APK.sha256"
          printf '{"versionCode":100,"versionName":"1.0","apkUrl":"https://github.com/sergeybikov1991-create/Dolby404/releases/latest/download/app-release.apk","sha256":"%s"}\n' "$SHA" > android-web-shell-test/app/build/outputs/apk/release/update.json

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-1.0-RC
          path: |
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk
            android-web-shell-test/app/build/outputs/apk/release/app-release.apk.sha256
            android-web-shell-test/app/build/outputs/apk/release/update.json
            android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
