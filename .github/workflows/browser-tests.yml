name: FLOUSTREAM browser tests

on:
  push:
    branches: [main, feature/floustream-backgammon-clean-release, feature/floustream-backgammon-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each feature-branch validation independent so a stalled runner
  # cannot hold newer rule/game-room checks in the queue.
  group: browser-tests-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Chromium smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run backgammon engine unit tests
        run: npm run test:unit

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  server-contract-tests:
    name: Free Postgres and Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: floustream_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d floustream_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the game Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/backgammon-action/index.ts

      - name: Parse browser game module
        run: node --check backgammon.js

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Bootstrap isolated Supabase-like roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d floustream_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE
            AS $$ SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          SQL

      - name: Apply backgammon migration to disposable Postgres
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d floustream_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119023324_backgammon_match_actions.sql

      - name: Apply open-match uniqueness migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d floustream_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119071510_backgammon_one_open_match_per_pair.sql

      - name: Verify idempotency, turn serialization and participant RLS
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d floustream_test -v ON_ERROR_STOP=1 -f tests/backgammon-migration.test.sql

  telegram-notify:
    name: Telegram notification
    runs-on: ubuntu-latest
    needs: [browser-tests, server-contract-tests]
    if: always()
    steps:
      - name: Send backgammon CI result to Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROWSER_RESULT: ${{ needs.browser-tests.result }}
          SERVER_RESULT: ${{ needs.server-contract-tests.result }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          MESSAGE="FLOUSTREAM — проверка нард завершена
          PR #${PR_NUMBER}
          Браузерные тесты: ${BROWSER_RESULT}
          Серверные проверки: ${SERVER_RESULT}
          ${PR_URL}"
          curl --fail-with-body --silent --show-error \
            --request POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
