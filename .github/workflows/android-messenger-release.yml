name: Build and publish FLOUSTREAM Messenger

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag"
        required: true
        default: "v0.3.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore and validate release signing key
        env:
          DOLBY404_KEYSTORE_BASE64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$DOLBY404_KEYSTORE_BASE64" || { echo "Missing DOLBY404_KEYSTORE_BASE64"; exit 1; }
          test -n "$DOLBY404_KEYSTORE_PASSWORD" || { echo "Missing DOLBY404_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DOLBY404_KEY_ALIAS" || { echo "Missing DOLBY404_KEY_ALIAS"; exit 1; }
          mkdir -p android-messenger/keystore
          printf '%s' "$DOLBY404_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android-messenger/keystore/release.jks
          test -s android-messenger/keystore/release.jks
          keytool -list -keystore android-messenger/keystore/release.jks -storepass "$DOLBY404_KEYSTORE_PASSWORD" -alias "$DOLBY404_KEY_ALIAS" >/dev/null
          echo "Signing key restored and validated."

      - name: Build signed release APK
        working-directory: android-messenger
        env:
          DOLBY404_KEYSTORE_PATH: ../keystore/release.jks
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          DOLBY404_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DOLBY404_KEY_PASSWORD" || { echo "Missing DOLBY404_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android-messenger/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" FLOUSTREAM-Messenger.apk
          sha256sum FLOUSTREAM-Messenger.apk > FLOUSTREAM-Messenger.apk.sha256

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Messenger-release
          path: |
            FLOUSTREAM-Messenger.apk
            FLOUSTREAM-Messenger.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: FLOUSTREAM Messenger ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: |
            FLOUSTREAM-Messenger.apk
            FLOUSTREAM-Messenger.apk.sha256
          generate_release_notes: true
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f android-messenger/keystore/release.jks
