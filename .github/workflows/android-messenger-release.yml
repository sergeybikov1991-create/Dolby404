name: Build signed FLOUSTREAM Messenger release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version tag"
        required: true
        default: "v0.4.26"
      publish_release:
        description: "Publish a GitHub Release after a successful build"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - "release/floustream-0.3.2"
      - "feature/messenger-0.4.0-foundation"
      - "feature/android-0.4.1-no-calls"
      - "feature/android-0.4.2-fixes"
      - "feature/android-0.4.3-whatsapp-chat"
      - "feature/android-0.4.4-chat-stability"
      - "feature/android-0.4.5-chat-media-fix"
      - "feature/android-0.4.6-media-playback-video-fix"
      - "feature/android-0.4.8-round-video-rebuild"
      - "feature/android-0.4.9-camera-finalize-fix"
      - "feature/android-0.4.10-round-video-diagnostics"
      - "feature/android-0.4.11-video-upload-file-api"
      - "feature/android-0.4.12-camera-preview-fix"
      - "feature/android-0.4.13-camera-lifecycle-fix"
      - "feature/android-0.4.15-rootencoder-video"
      - "feature/android-0.4.14-rootencoder-video"
      - "feature/android-0.4.16-rootencoder-default-recorder"
      - "feature/android-0.4.17-video-drafts-dual-camera"
      - "feature/android-0.4.23-fan-chat-visual"
      - "feature/android-0.4.25-f-chat-cache"
      - "feature/android-0.4.25-global-video-visual"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-messenger-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout immutable v0.4.24 source baseline
        uses: actions/checkout@v4
        with:
          ref: v0.4.24
          path: baseline-source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore and validate release signing key
        env:
          DOLBY404_KEYSTORE_BASE64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$DOLBY404_KEYSTORE_BASE64" || { echo "Missing DOLBY404_KEYSTORE_BASE64"; exit 1; }
          test -n "$DOLBY404_KEYSTORE_PASSWORD" || { echo "Missing DOLBY404_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DOLBY404_KEY_ALIAS" || { echo "Missing DOLBY404_KEY_ALIAS"; exit 1; }
          mkdir -p android-messenger/keystore
          printf '%s' "$DOLBY404_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android-messenger/keystore/release.jks
          test -s android-messenger/keystore/release.jks
          keytool -list -keystore android-messenger/keystore/release.jks -storepass "$DOLBY404_KEYSTORE_PASSWORD" -alias "$DOLBY404_KEY_ALIAS" >/dev/null
          echo "Signing key restored and validated."

      - name: Build signed release APK
        working-directory: android-messenger
        env:
          DOLBY404_KEYSTORE_PATH: ../keystore/release.jks
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          DOLBY404_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DOLBY404_KEY_PASSWORD" || { echo "Missing DOLBY404_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android-messenger/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" FLOUSTREAM-Messenger.apk
          sha256sum FLOUSTREAM-Messenger.apk > FLOUSTREAM-Messenger.apk.sha256

      - name: Package immutable baseline source snapshot
        run: git -C baseline-source archive --format=zip --prefix=FLOUSTREAM-v0.4.24/ HEAD > FLOUSTREAM-source-v0.4.24.zip

      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Messenger-release
          path: |
            FLOUSTREAM-Messenger.apk
            FLOUSTREAM-Messenger.apk.sha256
            FLOUSTREAM-source-v0.4.24.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) || github.ref == 'refs/heads/feature/android-0.4.2-fixes' || github.ref == 'refs/heads/feature/android-0.4.3-whatsapp-chat' || github.ref == 'refs/heads/feature/android-0.4.4-chat-stability' || github.ref == 'refs/heads/feature/android-0.4.5-chat-media-fix' || github.ref == 'refs/heads/feature/android-0.4.6-media-playback-video-fix' || github.ref == 'refs/heads/feature/android-0.4.8-round-video-rebuild' || github.ref == 'refs/heads/feature/android-0.4.9-camera-finalize-fix' || github.ref == 'refs/heads/feature/android-0.4.10-round-video-diagnostics' || github.ref == 'refs/heads/feature/android-0.4.11-video-upload-file-api' || github.ref == 'refs/heads/feature/android-0.4.12-camera-preview-fix' || github.ref == 'refs/heads/feature/android-0.4.13-camera-lifecycle-fix' || github.ref == 'refs/heads/feature/android-0.4.15-rootencoder-video' || github.ref == 'refs/heads/feature/android-0.4.14-rootencoder-video' || github.ref == 'refs/heads/feature/android-0.4.16-rootencoder-default-recorder' || github.ref == 'refs/heads/feature/android-0.4.17-video-drafts-dual-camera' || github.ref == 'refs/heads/feature/android-0.4.23-fan-chat-visual' || github.ref == 'refs/heads/feature/android-0.4.25-f-chat-cache' || github.ref == 'refs/heads/feature/android-0.4.25-global-video-visual'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.4.26') }}
          target_commitish: ${{ github.sha }}
          name: FLOUSTREAM Messenger ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.4.26') }}
          overwrite_files: true
          files: |
            FLOUSTREAM-Messenger.apk
            FLOUSTREAM-Messenger.apk.sha256
          generate_release_notes: true
          make_latest: true

      - name: Remove signing key
        if: always()
        run: rm -f android-messenger/keystore/release.jks
