name: Publish Dolby404 Messenger update

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore permanent signing key
        env:
          DOLBY404_KEYSTORE_BASE64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
        run: |
          test -n "$DOLBY404_KEYSTORE_BASE64" || (echo "Missing GitHub secret DOLBY404_KEYSTORE_BASE64" && exit 1)
          echo "$DOLBY404_KEYSTORE_BASE64" | base64 --decode > android-messenger/release-key.jks
      - name: Build signed release APK
        working-directory: android-messenger
        env:
          DOLBY404_KEYSTORE_PATH: release-key.jks
          DOLBY404_KEYSTORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          DOLBY404_KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          DOLBY404_KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          test -n "$DOLBY404_KEYSTORE_PASSWORD" || (echo "Missing GitHub secret DOLBY404_KEYSTORE_PASSWORD" && exit 1)
          test -n "$DOLBY404_KEY_ALIAS" || (echo "Missing GitHub secret DOLBY404_KEY_ALIAS" && exit 1)
          test -n "$DOLBY404_KEY_PASSWORD" || (echo "Missing GitHub secret DOLBY404_KEY_PASSWORD" && exit 1)
          gradle --no-daemon :app:assembleRelease
      - name: Prepare release APK
        run: cp android-messenger/app/build/outputs/apk/release/app-release.apk Dolby404-Messenger.apk
      - name: Package APK as ZIP
        run: zip -j Dolby404-Messenger.zip Dolby404-Messenger.apk
      - name: Upload install package
        uses: actions/upload-artifact@v4
        with:
          name: Dolby404-Messenger
          path: Dolby404-Messenger.zip
          if-no-files-found: error
      - name: Publish update
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Dolby404-Messenger.apk,Dolby404-Messenger.zip
          generate_release_notes: true
      - name: Remove signing key from runner
        if: always()
        run: rm -f android-messenger/release-key.jks
