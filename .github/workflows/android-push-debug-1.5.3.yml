name: FLOUSTREAM Android 1.5.3 Push Debug

on:
  push:
    branches:
      - fix/android-push-1.5.3-debug
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-push-debug-1.5.3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floustream-android-1-5-3-push-debug
  cancel-in-progress: false

jobs:
  debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Prepare the established signing key for an installable debug build
        env:
          KEYSTORE_B64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Required signing secrets are missing."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/floustream-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run Android unit tests
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debuggable APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify package, version and signing identity
        run: |
          APK=android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          CERT_SHA=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          EXPECTED_CERT_SHA="757681105E9DFA43B84036C637815FBA0A98FB6169DADF75E7AE136504A9EED9"
          if [ "$CERT_SHA" != "$EXPECTED_CERT_SHA" ]; then
            echo "::error::Debug APK signing identity does not match the established FLOUSTREAM certificate."
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "package: name='com.floustream.android' versionCode='120' versionName='1.5.3-debug'"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-1.5.3-Push-Debug
          path: |
            android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
            android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
