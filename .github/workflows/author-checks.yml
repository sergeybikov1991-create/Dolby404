name: AuTHOR preview checks

on:
  push:
    branches:
      - feature/author-my-photos-gallery
  pull_request:
    branches:
      - feature/author-my-photos-gallery
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: author-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  author-static-checks:
    name: AuTHOR banners and TYK navigation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify AuTHOR implementation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';

          const html = readFileSync('profile.html', 'utf8');

          const required = [
            ['AuTHOR hub entry', /data-author-hub="true"/],
            ['My Photos banner', /id="author-photos-banner"/],
            ['My Videos banner', /id="author-videos-banner"/],
            ['Video Editor banner', /id="author-editor-banner"/],
            ['lOOPS banner', /id="author-loops-banner"/],
            ['lOOPS inner page', /id="loops-page"/],
            ['2px banner spacing', /\.author-hub-stage\\{[^}]*gap:2px;padding:2px/],
            ['Photos gallery action', /openPhotoAlbum\(\)/],
            ['Videos album action', /openVideoAlbum\(\)/],
            ['temporary TYK button style', /author-banner-tap/]
          ];

          for (const [label, pattern] of required) {
            assert.match(html, pattern, `Missing or changed: ${label}`);
            console.log(`PASS: ${label}`);
          }

          const tapButtons = (html.match(/class="author-banner-tap"/g) || []).length;
          assert.equal(tapButtons, 4, 'Expected exactly four TYK buttons');
          console.log('PASS: exactly four TYK buttons');

          const guardedHandlers = (html.match(/closest\(["']\.author-banner-tap["']\)/g) || []).length;
          assert.equal(guardedHandlers, 4, 'Expected four handlers restricted to TYK button clicks');
          console.log('PASS: all four banner actions require a TYK button click');
          NODE
