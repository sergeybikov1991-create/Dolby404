name: Build FLOUSTREAM APK 2.0 — FCM

on:
  push:
    branches:
      - "feature/apk-2.0-fcm-notifications"
    paths:
      - "android-web-shell-test/**"
      - ".github/workflows/android-apk-2.0-fcm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-2-fcm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build debug APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-APK-2.0-FCM-debug
          path: android-web-shell-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
