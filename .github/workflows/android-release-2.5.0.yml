name: FLOUSTREAM Android 2.5.0 Release
on:
  push:
    branches: [release/android-2.5.0]
    paths: ["android-web-shell-test/**", ".github/workflows/android-release-2.5.0.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floustream-android-2-5-0-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: "8.13"}
      - name: Prepare established signing key
        env:
          KEYSTORE_B64: ${{ secrets.DOLBY404_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.DOLBY404_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOLBY404_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOLBY404_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/floustream-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/floustream-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/floustream-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Generate original lowercase f launcher icon
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python android-web-shell-test/scripts/generate_launcher_icons.py
          test -s android-web-shell-test/app/src/main/res/drawable/ic_launcher_foreground.png
          test -s android-web-shell-test/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -Fq 'android:icon="@mipmap/ic_launcher"' android-web-shell-test/app/src/main/AndroidManifest.xml
      - name: Verify approved Russian SPACE splash
        run: |
          F=android-web-shell-test/app/src/main/assets/splash.html
          test -s "$F"
          grep -Fq 'FLOUSTREAM' "$F"
          grep -Fq 'Добро пожаловать!' "$F"
          grep -Fq 'Готовим твою вселенную общения...' "$F"
      - name: Run unit tests
        working-directory: android-web-shell-test
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build signed Release APK
        working-directory: android-web-shell-test
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Verify package version, launcher, splash and signing identity
        run: |
          set -euo pipefail
          APK=android-web-shell-test/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          CERT_SHA=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          EXPECTED_CERT_SHA="757681105E9DFA43B84036C637815FBA0A98FB6169DADF75E7AE136504A9EED9"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -F "package: name='com.floustream.android' versionCode='125' versionName='2.5.0'"
          unzip -l "$APK" | grep -F 'assets/splash.html'
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep -E "^application-icon-[0-9]+:"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "$SHA  app-release.apk" > "$APK.sha256"
          mkdir -p release-assets
          cp "$APK" release-assets/app-release.apk
          cp "$APK.sha256" release-assets/app-release.apk.sha256
          printf '{"versionCode":125,"versionName":"2.5.0","apkUrl":"https://github.com/sergeybikov1991-create/Dolby404/releases/download/v2.5.0/app-release.apk","sha256":"%s"}\n' "$SHA" > release-assets/update.json
      - uses: actions/upload-artifact@v4
        with:
          name: FLOUSTREAM-Android-2.5.0-Release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish FLOUSTREAM Android 2.5.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          target_commitish: release/android-2.5.0
          name: FLOUSTREAM Android 2.5.0
          body: |
            FLOUSTREAM Android 2.5.0 — signed production Release.
            - Base: approved Debug 0.0.1 (e809e653aef4860e43a7bd2f5b6e3ab4afb93d0f)
            - Version: 2.5.0 (versionCode 125)
            - Established release signing certificate verified.
            - Original lowercase f launcher icon regenerated from preserved source artwork.
            - Approved Russian FLOUSTREAM SPACE 1.1 HTML startup screen.
            - APK SHA-256 and in-app update manifest included.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
            release-assets/update.json
          fail_on_unmatched_files: true
