<!-- FLOUSTREAM SPACE 1.1 | Русский космический экран загрузки -->
<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d20"><title>FLOUSTREAM</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-family:Arial,sans-serif;color:white;background:radial-gradient(ellipse at 50% 45%,#202f69,#111936 55%,#030610)}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 15% 20%,white,transparent),radial-gradient(2px 2px at 75% 15%,white,transparent),radial-gradient(1px 1px at 40% 30%,white,transparent),radial-gradient(2px 2px at 85% 65%,white,transparent),radial-gradient(1px 1px at 20% 75%,white,transparent),radial-gradient(2px 2px at 60% 85%,white,transparent);background-size:320px 320px;animation:twinkle 4s infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}header{z-index:5;margin-top:max(42px,7vh);text-align:center}.brand{font-size:clamp(27px,7vw,43px);font-weight:800;letter-spacing:5px;color:#e3edff;text-shadow:0 0 10px #6b9cff,0 0 25px #526cff,0 0 50px #414bff}
.universe{position:relative;width:min(88vw,370px);height:min(88vw,370px);display:grid;place-items:center;flex-shrink:0}.earth-glow{position:absolute;width:75%;height:75%;border-radius:50%;background:#326eff;filter:blur(65px);opacity:.35}
.earth{position:relative;width:65%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 30% 30%,#8cd8ff,#247cc7 25%,#07509c 55%,#031d53);box-shadow:inset -25px -10px 40px #000c35,inset 12px 8px 25px #8ddaff,0 0 20px #428fff,0 0 55px #246cff}
.earth:before{content:"";position:absolute;inset:0;width:200%;background:radial-gradient(ellipse at 20% 30%,#69a94b 0 8%,transparent 9%),radial-gradient(ellipse at 32% 65%,#70b54e 0 11%,transparent 12%),radial-gradient(ellipse at 68% 25%,#77b85d 0 13%,transparent 14%),radial-gradient(ellipse at 85% 68%,#73ad4e 0 10%,transparent 11%);animation:earthRotate 18s linear infinite}
.earth:after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(90deg,transparent 35%,#020a2b99)}
.orbit{position:absolute;width:100%;height:43%;border:1px solid #83bdff80;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 10px #428fff50}.satellite-orbit{position:absolute;width:100%;height:43%;transform:rotate(-25deg);animation:orbit 7s linear infinite}
.satellite{position:absolute;top:-13px;left:50%;width:30px;height:30px;transform:translateX(-50%)}.satellite-core{position:absolute;left:10px;top:10px;width:10px;height:10px;background:#d9f0ff;border-radius:3px;box-shadow:0 0 12px #7fc9ff}
.panel{position:absolute;top:12px;width:9px;height:7px;background:linear-gradient(90deg,#1c55a4,#7acaff);border:1px solid #9ccaff}.panel.left{left:0}.panel.right{right:0}
@keyframes orbit{from{transform:rotate(-25deg)}to{transform:rotate(335deg)}}@keyframes earthRotate{from{transform:translateX(0)}to{transform:translateX(-50%)}}
footer{z-index:5;width:100%;text-align:center;padding:0 20px max(38px,7vh)}.welcome{font-size:22px;font-weight:600}.message{color:#aabce9;font-size:14px;margin-top:12px}
.loading{width:170px;height:3px;margin:28px auto 0;border-radius:10px;background:#ffffff25;overflow:hidden}.loading:after{content:"";display:block;width:40%;height:100%;background:#9fcaff;box-shadow:0 0 12px #599aff;animation:loading 1.7s infinite ease-in-out}
@keyframes loading{from{transform:translateX(-110%)}to{transform:translateX(430%)}}@media(max-height:650px){header{margin-top:22px}.universe{width:min(72vw,290px);height:min(72vw,290px)}footer{padding-bottom:22px}.loading{margin-top:18px}}
</style></head><body><div class="stars"></div><header><div class="brand">FLOUSTREAM</div></header>
<div class="universe"><div class="earth-glow"></div><div class="orbit"></div><div class="earth"></div><div class="satellite-orbit"><div class="satellite"><div class="panel left"></div><div class="satellite-core"></div><div class="panel right"></div></div></div></div>
<footer><div class="welcome">Добро пожаловать!</div><div class="message">Готовим твою вселенную общения...</div><div class="loading"></div></footer></body></html>
