<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FLOUSTREAM — Подключение</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;color:#fff}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 24px;
background:radial-gradient(ellipse at 50% 35%,#19264a 0%,#0b1022 55%,#070a14 100%)}
.screen{width:100%;max-width:390px}
.brand{text-align:center;font-size:27px;font-weight:700;letter-spacing:3px;color:#b8d9ff;text-shadow:0 0 18px #438dff}
.subtitle{margin-top:12px;text-align:center;color:#899bbd;font-size:14px}
.routes{margin-top:38px;padding:18px 22px;border:1px solid rgba(112,153,255,.15);border-radius:18px;
background:rgba(22,34,62,.55);box-shadow:0 10px 35px rgba(0,0,0,.2)}
.route{display:flex;align-items:center;gap:13px;padding:14px 0}
.route+.route{border-top:1px solid rgba(255,255,255,.06)}
.dot{width:9px;height:9px;flex-shrink:0;border-radius:50%;background:#58647c}
.route.checking .dot{background:#54c9ff;box-shadow:0 0 12px #54c9ff;animation:pulse 1.5s infinite}
.route.done .dot{background:#61dfb0;box-shadow:0 0 10px #61dfb0}
.route.failed .dot{background:#ff626e;box-shadow:0 0 10px #ff626e}
.country{font-size:15px}
.status{margin-left:auto;font-size:12px;color:#7889a9}
.route.checking .status{color:#65d1ff}
.route.done .status{color:#72e5b9}
.route.failed .status{color:#ff7880}
.progress{margin-top:26px;height:3px;background:#26334e;border-radius:10px;overflow:hidden}
.progress-bar{width:4%;height:100%;background:#55caff;box-shadow:0 0 12px #55caff;transition:width .35s ease}
.message{min-height:38px;margin-top:19px;text-align:center;color:#9eacc8;font-size:13px;line-height:1.5}
.retry{display:none;width:100%;min-height:48px;margin-top:18px;border:1px solid rgba(150,180,255,.45);border-radius:14px;
background:linear-gradient(110deg,#405bd0,#6842a8);color:#fff;font-size:15px;font-weight:700}
.retry.visible{display:block}
@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.route.checking .dot{animation:none}.progress-bar{transition:none}}
</style>
</head>
<body>
<main class="screen">
  <div class="brand">FLOUSTREAM</div>
  <div class="subtitle">Подключение к серверу</div>

  <section class="routes" aria-live="polite">
    <div class="route" data-stage="internet">
      <span class="dot"></span><span class="country">Интернет</span><span class="status">Ожидание</span>
    </div>
    <div class="route" data-stage="dns">
      <span class="dot"></span><span class="country">DNS</span><span class="status">Ожидание</span>
    </div>
    <div class="route" data-stage="server">
      <span class="dot"></span><span class="country">Основной шлюз</span><span class="status">Ожидание</span>
    </div>
  </section>

  <div class="progress"><div class="progress-bar" id="progress"></div></div>
  <div class="message" id="message">Подготавливаем проверку соединения…</div>
  <button class="retry" id="retry" type="button">Повторить проверку</button>
</main>

<script>
(function(){
  const rows = Array.from(document.querySelectorAll("[data-stage]"));
  const message = document.getElementById("message");
  const progress = document.getElementById("progress");
  const retry = document.getElementById("retry");

  function update(stage, status, text, percent, failed) {
    const row = rows.find(item => item.dataset.stage === stage);
    if (row) {
      row.classList.remove("checking", "done", "failed");
      row.classList.add(failed ? "failed" : status === "Готово" || status === "Подключено" ? "done" : "checking");
      row.querySelector(".status").textContent = status;
    }
    message.textContent = text;
    progress.style.width = Math.max(0, Math.min(100, Number(percent) || 0)) + "%";
    retry.classList.toggle("visible", !!failed);
  }

  retry.addEventListener("click", function(){
    retry.classList.remove("visible");
    rows.forEach(row => {
      row.classList.remove("checking", "done", "failed");
      row.querySelector(".status").textContent = "Ожидание";
    });
    message.textContent = "Повторно проверяем подключение…";
    progress.style.width = "2%";
    if (window.FloustreamConnectionBridge) {
      window.FloustreamConnectionBridge.retry();
    } else {
      message.textContent = "Не удалось запустить проверку. Перезапусти приложение.";
      retry.classList.add("visible");
    }
  });

  window.FLOUSTREAMConnection = { update: update };
})();
</script>
</body>
</html>
