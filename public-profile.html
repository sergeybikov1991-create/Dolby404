<style>
:root{color-scheme:dark;--bg:#090910;--panel:#15121f;--line:#382b4b;--purple:#a66bff;--muted:#aaa0ba;--text:#f5f0ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#281342 0,transparent 38%),var(--bg);color:var(--text);font-family:Arial,sans-serif}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(calc((100% - 900px)/2),16px);border-bottom:1px solid var(--line);background:#0b0a12ed;backdrop-filter:blur(12px)}
.logo{font-size:20px;font-weight:900;letter-spacing:3px;color:#e9d8ff;text-shadow:0 0 18px #7b4bff}
.topbar a,.topbar button{border:1px solid #65458a;border-radius:12px;background:#21172f;color:#eee2ff;padding:10px 13px;text-decoration:none;font-size:13px}
.wrap{width:min(900px,100%);margin:24px auto;padding:0 16px}
.profile{overflow:hidden;border:1px solid #49345f;border-radius:20px;background:linear-gradient(145deg,#171321,#0e0d16);box-shadow:0 12px 45px #0007}
.cover{height:170px;background:radial-gradient(ellipse at 72% 30%,#a34bff66 0,transparent 34%),linear-gradient(125deg,#090912,#21102f 55%,#111b35)}
.identity{display:flex;align-items:end;gap:16px;margin:-46px 22px 0;position:relative}
.avatar{width:100px;height:100px;flex:0 0 100px;display:grid;place-items:center;overflow:hidden;border:3px solid #171321;border-radius:50%;background:#352044;font-size:32px;font-weight:700;box-shadow:0 0 18px #a66bff55}

.name{min-width:0;padding-bottom:7px}.name h1{margin:0 0 5px;font-size:clamp(21px,4vw,29px);overflow-wrap:anywhere}.name p{margin:0;color:#c59aff;font-size:13px}
.bio{margin:16px 22px 22px;color:#c9c0d8;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.feed-section{margin-top:24px}.feed-title{margin:0 0 14px;font-size:19px}
.feed{display:flex;flex-direction:column;gap:12px}
.post{padding:16px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#191625,#101019)}
.post-author-label{margin-bottom:2px;color:#a99bbd;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.flow-banner{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:8px 11px;border:1px solid #63477f;border-radius:10px;background:linear-gradient(100deg,#281936,#171321);color:#d9baff;font-size:11px;font-weight:700}
.flow-banner:before{content:"↗";display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:#593477;color:#fff;font-size:13px}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.post-avatar{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;overflow:hidden;border-radius:50%;background:#302044;font-weight:700}
.post-avatar img{width:100%;height:100%;object-fit:cover}
.post-author{font-size:14px;font-weight:700}.post-date{margin-top:4px;color:var(--muted);font-size:11px}
.post-content{color:#e9e4f2;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.post-media{display:grid;gap:10px;margin-top:12px}.post-media img,.post-media video{display:block;width:100%;max-height:520px;object-fit:contain;border-radius:12px;background:#090910}.post-photo-open{display:block;position:relative;width:100%;margin:0;padding:0;overflow:hidden;border:1px solid #49385e;border-radius:12px;background:#090910;cursor:zoom-in;touch-action:manipulation;-webkit-tap-highlight-color:transparent;line-height:0}.post-photo-open img{display:block;width:100%;height:auto;max-height:520px;object-fit:contain;border-radius:11px;transition:filter .15s ease,transform .15s ease}.post-photo-open:active,.post-photo-open:focus-visible{outline:none;border-color:#c18aff;box-shadow:0 0 0 2px #a66bff66,0 0 18px #a66bff55}.post-photo-open:active img{filter:brightness(.88);transform:scale(.995)}.post-media audio{width:100%}
.post-actions{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:11px;border-top:1px solid #342943}
.flow-button{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid #59436f;border-radius:999px;background:linear-gradient(135deg,#21192d,#15111e);color:#e5d4ff;font-size:12px;font-weight:800;letter-spacing:1px}
.flow-button.active{border-color:#c18aff;background:linear-gradient(135deg,#49265f,#21152f);box-shadow:0 0 12px #a66bff38}
.flow-button:disabled{opacity:.55}
.status,.empty{padding:20px;text-align:center;color:var(--muted);line-height:1.6}
.post-social-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:11px;border-top:1px solid #342943}
.post-social-button{min-height:36px;padding:7px 11px;border:1px solid #49385e;border-radius:11px;background:#171321;color:#e9ddff;font-size:12px}
.post-social-button.is-active{border-color:#b879ff;background:linear-gradient(135deg,#42245d,#21162f);color:#fff;box-shadow:0 0 12px #a66bff30}
.post-reaction-wrap{position:relative;display:inline-flex}
.post-reaction-picker{position:absolute;left:0;bottom:calc(100% + 9px);z-index:15;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:min(306px,calc(100vw - 58px));padding:9px;border:1px solid #7952a0;border-radius:15px;background:rgba(18,14,28,.98);box-shadow:0 12px 36px #000b}
.post-reaction-picker[hidden],.post-comments-panel[hidden]{display:none}
.post-reaction-option{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:0;min-height:49px;padding:5px 2px;border:1px solid #3c304d;border-radius:10px;background:#171321;color:#f5eaff}
.post-reaction-option .reaction-emoji{font-size:21px;line-height:1.15}
.post-reaction-option .reaction-count{font-size:10px;color:#b9a8cc}
.post-reaction-option.is-active{border-color:#c18aff;background:linear-gradient(145deg,#42245d,#21162f)}
.post-comments-panel{margin-top:12px;padding:12px;border:1px solid #49385e;border-radius:13px;background:#100e18}
.post-comments-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:#e9ddff;font-size:13px;font-weight:700}
.post-comments-close{padding:6px 9px;border-radius:9px;font-size:11px}
.post-comments-list{display:grid;gap:9px;max-height:300px;overflow:auto}
.post-comment{padding:9px;border:1px solid #302640;border-radius:10px;background:#171321;font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.post-comment strong{display:block;margin-bottom:3px;color:#d9baff}
.post-comment time{display:block;margin-top:5px;color:#8f849f;font-size:10px}
.post-comment-form{display:grid;gap:8px;margin-top:10px}
.post-comment-form textarea{width:100%;min-height:58px;resize:vertical;padding:10px;border:1px solid #49385e;border-radius:10px;background:#090811;color:#fff;font:inherit;font-size:13px}
.post-comment-form button{justify-self:end;padding:8px 13px;border:1px solid #7952a0;border-radius:10px;background:#39204f;color:#fff;font-size:12px}
.post-comment-note{margin-top:8px;color:#bda6d8;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.post-social-button:disabled,.post-reaction-option:disabled,.post-comment-form button:disabled{opacity:.5}

.photo-lightbox{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;box-sizing:border-box;padding:clamp(12px,3vw,24px);background:rgba(0,0,0,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:manipulation}
.photo-lightbox.is-open{display:flex}
.photo-lightbox img{display:block;box-sizing:border-box;width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;border:2px solid #bd78ff;border-radius:8px;box-shadow:0 0 0 1px #f0d7ff66,0 0 18px #a64dffb3,0 0 42px #7628d966;background:#090910}
.photo-lightbox-close{position:absolute;top: max(12px,env(safe-area-inset-top));right: max(12px,env(safe-area-inset-right));z-index:2;width:34px;height:34px;padding:0;border:1px solid #ffffff55;border-radius:50%;background:rgba(30,25,38,.48);color:#fff;font-size:23px;font-weight:300;line-height:30px;display:grid;place-items:center;backdrop-filter:blur(6px);cursor:pointer}
.photo-lightbox-close:active{background:rgba(100,70,130,.7)}
body.lightbox-open{overflow:hidden}

.error{color:#ffb4c0}
@media(max-width:600px){.topbar{padding:10px 12px}.logo{font-size:17px}.wrap{margin:14px auto;padding:0 10px}.cover{height:130px}.identity{margin:-39px 14px 0;gap:12px}.avatar{width:82px;height:82px;flex-basis:82px}.bio{margin:14px}.post{border-radius:0;border-left:0;border-right:0}.feed{gap:0}.post+.post{border-top:0}}
/* FLOUSTREAM slide navigation */
.quick-nav{display:none!important}
.drawer-menu-button{position:fixed;z-index:83;left:14px;top:15px;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid #704b91;border-radius:14px;background:linear-gradient(145deg,#21152ff2,#100d19f2);box-shadow:0 0 16px #8d50e733,inset 0 0 12px #9b5bd511;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:1;transform:scale(1);visibility:visible;transition:opacity .18s ease,transform .18s ease,visibility .18s}
.drawer-menu-button.is-hidden{opacity:0;transform:scale(.78);visibility:hidden;pointer-events:none}
.sound-signal{display:flex;align-items:center;justify-content:center;gap:3px;width:22px;height:22px}
.sound-signal i{display:block;width:3px;border-radius:3px;background:linear-gradient(180deg,#e9d5ff,#a66bff);box-shadow:0 0 7px #b879ff99}
.sound-signal i{transform-origin:center;animation:signalEqualizer .78s ease-in-out infinite alternate}
.sound-signal i:nth-child(1){height:8px;animation-delay:-.62s}
.sound-signal i:nth-child(2){height:16px;animation-delay:-.38s}
.sound-signal i:nth-child(3){height:21px;animation-delay:-.12s}
.sound-signal i:nth-child(4){height:12px;animation-delay:-.5s}
.sound-signal i:nth-child(5){height:6px;animation-delay:-.27s}
@keyframes signalEqualizer{0%{transform:scaleY(.28);opacity:.68}100%{transform:scaleY(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.sound-signal i{animation:none}}
.drawer-edge{position:fixed;z-index:81;left:0;top:0;bottom:0;width:22px;touch-action:pan-y}
.drawer-backdrop{position:fixed;z-index:80;inset:0;background:#030209;opacity:0;pointer-events:none;transition:opacity .18s}
.drawer-backdrop.visible{pointer-events:auto}
.side-drawer{display:flex;flex-direction:column;--drawer-x:-100%;position:fixed;z-index:82;left:0;top:0;bottom:0;width:min(82vw,320px);padding:22px 16px max(22px,env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(160deg,#1b1428,#0c0b14 72%);border-right:1px solid #8054aa;box-shadow:12px 0 42px #0009;transform:translate3d(var(--drawer-x),0,0);transition:transform .24s cubic-bezier(.2,.8,.2,1);will-change:transform;touch-action:pan-y}
.side-drawer.dragging{transition:none}
.side-drawer-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 24px}
.side-drawer-logo{font-size:21px;font-weight:900;letter-spacing:3px;color:#f5eaff;text-shadow:0 0 18px #9b55ff}
.side-drawer-close{width:36px;height:36px;padding:0;border-radius:11px;background:#21172f;font-size:20px}
.side-drawer-caption{margin:0 8px 9px;color:#8f83a5;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
.side-drawer-links{display:grid;gap:7px}
.side-drawer-link{display:flex;align-items:center;gap:13px;width:100%;min-height:49px;padding:10px 13px;border:1px solid transparent;border-radius:12px;background:transparent;color:#e9ddff;text-align:left;font-size:14px}
.side-drawer-link:active,.side-drawer-link.active{background:linear-gradient(100deg,#392052aa,#1b1429);border-color:#68458d}
.side-drawer-icon{width:23px;text-align:center;color:#c18aff;font-size:18px}
.side-drawer-divider{height:1px;margin:17px 4px;background:#33283f}
.nav-history{margin:13px 4px 2px;padding:11px 9px 10px;border:1px solid #342541;border-radius:13px;background:#110e19aa}
.nav-history .side-drawer-caption{margin:0 0 8px 2px}
.nav-history-items{display:grid;gap:6px}
.nav-profile-visits{display:grid;gap:6px;margin:0 0 7px}.nav-profile-visit{display:flex;align-items:center;gap:9px;min-height:42px;padding:6px 8px;border:1px solid #352744;border-radius:9px;background:#1b1525;color:#e8dcf8;text-decoration:none;overflow:hidden}.nav-profile-visit:active{background:#352044}.nav-profile-visit-avatar{width:29px;height:29px;flex:0 0 29px;border-radius:50%;object-fit:cover;background:#30213e}.nav-profile-visit-copy{display:grid;min-width:0;gap:2px}.nav-profile-visit-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:650}.nav-profile-visit-time{color:#9586a8;font-size:10px}
.nav-history-item{display:flex;align-items:center;gap:9px;width:100%;min-height:37px;padding:7px 8px;border:1px solid #352744;border-radius:9px;background:#1b1525;color:#d9c8f2;text-align:left;font-size:12px;overflow:hidden}
.nav-history-item:active{background:#352044}
.nav-history-item .side-drawer-icon{width:19px;font-size:15px}
.nav-history-empty{padding:5px 2px;color:#81758f;font-size:11px}


/* Drawer search menu */
.drawer-search{margin:12px 4px 2px}
.drawer-search-toggle{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:46px;padding:10px 13px;border:1px solid #654586;border-radius:12px;background:linear-gradient(110deg,#342044,#1a1426);color:#f0e4ff;font-size:14px;font-weight:700;box-shadow:0 5px 18px #0003;transition:border-color .18s,background .18s}
.drawer-search-toggle:active,.drawer-search-toggle[aria-expanded="true"]{border-color:#b17bea;background:linear-gradient(110deg,#492966,#241831)}
.drawer-search-toggle .drawer-search-chevron{margin-left:auto;color:#bd8aff;transition:transform .18s}
.drawer-search-toggle[aria-expanded="true"] .drawer-search-chevron{transform:rotate(180deg)}
.drawer-search-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.drawer-search-options[hidden]{display:none}
.drawer-search-option{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 6px;border:1px solid #49345f;border-radius:10px;background:#15101f;color:#e6d5fb;font-size:12px;font-weight:600}
.drawer-search-option:active{background:#38214e;border-color:#9d69cf}
.drawer-search-option span{font-size:16px;color:#c18aff}
.side-drawer-foot{margin:22px 8px 0;color:#756b87;font-size:11px;line-height:1.5}
@media(prefers-reduced-motion:reduce){.drawer-backdrop,.side-drawer{transition:none}}

 if(media.length){const box=document.createElement("div");box.className="post-media";for(const item of media){const url=safeUrl(item.url);if(!url)continue;let node;if(item.type==="photo"){const photoButton=document.createElement("button");photoButton.type="button";photoButton.className="post-photo-open";photoButton.setAttribute("aria-label","Открыть фотографию на весь экран");node=document.createElement("img");node.alt="Фото публикации";node.loading="lazy";node.decoding="async";node.src=url;photoButton.addEventListener("click",event=>{event.preventDefault();event.stopPropagation();openPhotoViewer(node.currentSrc||node.src);});photoButton.append(node);box.append(photoButton);continue;}else if(item.type==="music"){node=document.createElement("audio");node.controls=true;}else{node=document.createElement("video");node.controls=true;node.playsInline=true;node.preload="metadata";}node.src=url;box.append(node);}if(box.children.length)card.append(box);}

async function loadProfileVisitHistory(){
 const host=$("nav-profile-visits");if(!host||!client||!viewer)return;
 try{
  const visits=await client.from("profile_visits").select("visited_profile_id,last_visited_at").eq("visitor_id",viewer.id).order("last_visited_at",{ascending:false}).limit(5);
  if(visits.error)throw visits.error;

  const ids=rows.map(row=>row.visited_profile_id);
  const profiles=await client.from("profiles").select("id,username,display_name,avatar_url").in("id",ids);
  if(profiles.error)throw profiles.error;
  const byId=new Map((profiles.data||[]).map(profile=>[profile.id,profile]));
  rows.forEach(row=>{
   const profile=byId.get(row.visited_profile_id);if(!profile)return;
   const name=profile.display_name||profile.username||"Пользователь";
   const link=document.createElement("a");link.className="nav-profile-visit";link.href="public-profile.html?id="+encodeURIComponent(profile.id);
   if(profile.avatar_url){const avatar=document.createElement("img");avatar.className="nav-profile-visit-avatar";avatar.src=profile.avatar_url;avatar.alt="";avatar.loading="lazy";link.append(avatar);}
   else{const avatar=document.createElement("span");avatar.className="nav-profile-visit-avatar";avatar.style.display="grid";avatar.style.placeItems="center";avatar.textContent=name.slice(0,1).toUpperCase();link.append(avatar);}
   const copy=document.createElement("span");copy.className="nav-profile-visit-copy";
   const title=document.createElement("span");title.className="nav-profile-visit-name";title.textContent=name;
   const time=document.createElement("span");time.className="nav-profile-visit-time";time.textContent=row.last_visited_at?new Date(row.last_visited_at).toLocaleString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
   copy.append(title,time);link.append(copy);host.append(link);
  });
 }catch(error){console.warn("FLOUSTREAM visit history:",error);}
}

async function start(){
 try{
  await loadLibrary();client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const auth=await client.auth.getUser();if(auth.error)throw auth.error;viewer=auth.data.user;
  const targetId=new URLSearchParams(location.search).get("id");if(!targetId){showError("Не указан профиль для просмотра.");return;}
  if(viewer&&targetId===viewer.id){location.replace("profile.html");return;}
  const profileResult=await client.from("profiles").select("id,username,display_name,bio,avatar_url,avatar_photo_id,cover_url,last_activity_at,time_zone").eq("id",targetId).maybeSingle();
  if(profileResult.error)throw profileResult.error;if(!profileResult.data){showError("Профиль не найден или недоступен.");return;}
  target=profileResult.data;
  renderTargetPresence(false);
  watchTargetPresence();
  if(viewer){
   const recorded=await client.from("profile_visits").upsert({visitor_id:viewer.id,visited_profile_id:target.id,last_visited_at:new Date().toISOString()},{onConflict:"visitor_id,visited_profile_id"});
   if(recorded.error)console.warn("FLOUSTREAM visit recording:",recorded.error);
   loadProfileVisitHistory();
  }
  $("display-name").textContent=target.display_name||target.username||"Пользователь";
  $("username").textContent=target.username?"@"+target.username:"";
  $("bio").textContent=target.bio||"";
  const avatar=safeUrl(target.avatar_url);if(avatar){$("avatar").replaceChildren();const img=document.createElement("img");img.src=avatar;img.alt="Аватар";$("avatar").append(img);$("avatar").classList.add("has-original");$("avatar").setAttribute("role","button");$("avatar").tabIndex=0;$("avatar").setAttribute("aria-label","Открыть оригинал фотографии профиля");}else{$("avatar").textContent=(target.display_name||target.username||"◉").slice(0,1).toUpperCase();$("avatar").classList.remove("has-original");$("avatar").removeAttribute("role");$("avatar").removeAttribute("tabindex");$("avatar").removeAttribute("aria-label");}
  const cover=safeUrl(target.cover_url);if(cover)$("cover").style.backgroundImage="linear-gradient(#09091055,#09091055),url("+JSON.stringify(cover)+")";
  const [ownPosts,flows]=await Promise.all([
   client.from("posts").select("*").eq("user_id",targetId).order("created_at",{ascending:false}).limit(50),
   client.from("reposts").select("id,user_id,post_id,created_at").eq("user_id",targetId).order("created_at",{ascending:false}).limit(50)
  ]);
  if(ownPosts.error)throw ownPosts.error;if(flows.error)throw flows.error;
  const flowRows=flows.data||[],flowIds=flowRows.map(row=>row.post_id).filter(Boolean);
  const flowPosts=flowIds.length?await client.from("posts").select("*").in("id",flowIds):{data:[],error:null};
  if(flowPosts.error)throw flowPosts.error;
  const flowById=new Map(flowRows.map(row=>[String(row.post_id),row])),merged=new Map();
  for(const post of ownPosts.data||[])merged.set(String(post.id),{post,sortAt:post.created_at||"",flowMeta:null});
  for(const post of flowPosts.data||[]){const meta=flowById.get(String(post.id));if(!meta)continue;const key=String(post.id),existing=merged.get(key);if(!existing||new Date(meta.created_at||0)>new Date(existing.sortAt||0))merged.set(key,{post,sortAt:meta.created_at||post.created_at||"",flowMeta:meta});}
  const entries=[...merged.values()].sort((a,b)=>new Date(b.sortAt||0)-new Date(a.sortAt||0));
  if(!entries.length){$("feed").replaceChildren();const empty=document.createElement("div");empty.className="empty";empty.textContent="Пока нет доступных публикаций."; $("feed").append(empty);return;}
  const authorIds=[...new Set(entries.map(x=>x.post.user_id).filter(Boolean))];
  const authorResult=authorIds.length?await client.from("profiles").select("id,username,display_name,avatar_url").in("id",authorIds):{data:[],error:null};
  if(authorResult.error)throw authorResult.error;
  const authors=new Map((authorResult.data||[]).map(p=>[p.id,p]));$("feed").replaceChildren();
  for(const entry of entries)$("feed").append(await renderPost(entry.post,authors,entry.flowMeta));
 }catch(error){showError("Не удалось открыть страницу: "+error.message);}
}
(function initPublicSideDrawer(){
 const button=$("drawer-menu-button"),drawer=$("side-drawer"),backdrop=$("drawer-backdrop"),edge=$("drawer-edge"),close=$("drawer-close");
 if(!button||!drawer||!backdrop||!close)return;
 let opened=false;
 function setOpen(value){opened=!!value;drawer.style.setProperty("--drawer-x",opened?"0%":"-100%");backdrop.classList.toggle("visible",opened);backdrop.style.opacity=opened?"1":"0";button.classList.toggle("is-hidden",opened);button.setAttribute("aria-expanded",String(opened));drawer.setAttribute("aria-hidden",String(!opened));document.body.style.overflow=opened?"hidden":"";}
 button.addEventListener("click",()=>setOpen(!opened));close.addEventListener("click",()=>setOpen(false));backdrop.addEventListener("click",()=>setOpen(false));
 document.addEventListener("keydown",event=>{if(event.key==="Escape"&&opened)setOpen(false);});
 const searchToggle=$("drawer-search-toggle"),searchOptions=$("drawer-search-options");if(searchToggle&&searchOptions)searchToggle.addEventListener("click",()=>{const expanded=searchToggle.getAttribute("aria-expanded")==="true";searchToggle.setAttribute("aria-expanded",String(!expanded));searchOptions.hidden=expanded;});
 let startX=null;edge.addEventListener("touchstart",event=>{startX=event.touches[0].clientX;},{passive:true});edge.addEventListener("touchend",event=>{if(startX!==null&&event.changedTouches[0].clientX-startX>45)setOpen(true);startX=null;},{passive:true});
})();
start();
</script>
